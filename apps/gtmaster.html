<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>吉他和弦大师 - 和弦学习游戏</title>
<style>
:root {
  --primary: #e74c3c;
  --primary-dark: #c0392b;
  --secondary: #2c3e50;
  --accent: #f39c12;
  --success: #27ae60;
  --bg: #1a1a2e;
  --bg2: #16213e;
  --bg3: #0f3460;
  --text: #ecf0f1;
  --text-dim: #95a5a6;
  --card: rgba(255,255,255,0.08);
  --card-hover: rgba(255,255,255,0.14);
  --shadow: 0 4px 20px rgba(0,0,0,0.3);
  --radius: 12px;
  --transition: 0.3s ease;
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

html, body {
  width:100%; height:100%;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  overflow-x: hidden;
  user-select: none;
  -webkit-user-select: none;
}

#app {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  background: linear-gradient(135deg, var(--bg) 0%, var(--bg2) 50%, var(--bg3) 100%);
}

.page { display: none; }
.page.active { display: block; }
.page-leaving {
  position: absolute;
  inset: 0;
  z-index: 5;
}
#gamePage.active {
  display: flex;
  flex-direction: column;
  height: 100%;
  overflow: hidden;
}

::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 3px; }

.sound-toggle {
  background: none;
  border: 1px solid rgba(255,255,255,0.2);
  color: var(--text);
  width: 36px; height: 36px;
  border-radius: 50%;
  font-size: 1.1em;
  cursor: pointer;
  transition: var(--transition);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.sound-toggle:hover { background: rgba(255,255,255,0.1); }
.sound-toggle.muted { opacity: 0.4; }
</style>
<style>
.top-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  background: rgba(0,0,0,0.3);
  backdrop-filter: blur(10px);
  position: sticky;
  top: 0;
  z-index: 100;
}
.top-bar .logo {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 1.2em;
  font-weight: 700;
  color: var(--accent);
}
.top-bar .logo svg { width:28px; height:28px; }
.top-bar .stats {
  display: flex;
  gap: 16px;
  font-size: 0.9em;
}
.top-bar .stat-item {
  display: flex;
  align-items: center;
  gap: 4px;
}
.stat-item .label { color: var(--text-dim); }
.stat-item .value { font-weight: 700; color: var(--accent); }
.top-actions {
  display: flex;
  gap: 6px;
}
.back-btn {
  background: none; border: none; color: var(--text);
  font-size: 1.4em; cursor: pointer; padding: 4px 8px;
  border-radius: 8px; transition: var(--transition);
}
.back-btn:hover { background: rgba(255,255,255,0.1); }

.main-content {
  flex: 1;
  padding: 16px;
  max-width: 900px;
  margin: 0 auto;
  width: 100%;
  overflow-y: auto;
  position: relative;
}
.main-content:has(#gamePage.active) {
  padding: 0;
  max-width: none;
  overflow: hidden;
}

.home-hero {
  text-align: center;
  padding: 30px 0 20px;
}
.home-hero h1 {
  font-size: 2em;
  background: linear-gradient(135deg, var(--accent), var(--primary));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 8px;
}
.home-hero p { color: var(--text-dim); font-size: 1em; }

.mode-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 14px;
  margin-top: 24px;
}
.mode-card {
  background: rgba(255,255,255,0.06);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: var(--radius);
  padding: 24px 16px;
  text-align: center;
  cursor: pointer;
  transition: var(--transition);
  position: relative;
  overflow: hidden;
}
.mode-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: linear-gradient(90deg, var(--accent), var(--primary));
  transform: scaleX(0);
  transition: transform 0.3s ease;
}
.mode-card:hover::before, .mode-card:active::before { transform: scaleX(1); }
.mode-card:hover, .mode-card:active {
  background: var(--card-hover);
  transform: translateY(-2px);
  box-shadow: var(--shadow);
}
.mode-card:active { transform: scale(0.97); }
.mode-card .icon { font-size: 2.4em; margin-bottom: 10px; display:block; }
.mode-card .title { font-weight: 700; font-size: 1.05em; margin-bottom: 4px; }
.mode-card .desc { font-size: 0.8em; color: var(--text-dim); }

.library-search-row {
  display: flex;
  gap: 10px;
  align-items: center;
  margin-bottom: 10px;
}
.chord-search {
  flex: 1;
  padding: 10px 16px;
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 24px;
  background: rgba(255,255,255,0.06);
  color: var(--text);
  font-size: 0.9em;
  outline: none;
  transition: border-color 0.3s;
}
.chord-search:focus { border-color: var(--accent); }
.chord-search::placeholder { color: var(--text-dim); }

.view-toggle {
  padding: 10px 12px;
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: var(--radius);
  background: rgba(255,255,255,0.06);
  color: var(--text);
  font-size: 1.1em;
  cursor: pointer;
  transition: var(--transition);
}
.view-toggle:hover { background: rgba(255,255,255,0.1); }
.view-toggle.active { background: var(--accent); color: #000; }

.library-filter-row {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
  overflow-x: auto;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
  padding: 2px 0;
  touch-action: pan-x pan-y;
}
.library-filter-row::-webkit-scrollbar { display: none; }

.filter-btn {
  padding: 6px 14px;
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 20px;
  background: transparent;
  color: var(--text);
  font-size: 0.85em;
  cursor: pointer;
  transition: var(--transition);
  white-space: nowrap;
  flex-shrink: 0;
}
.filter-btn:hover { background: rgba(255,255,255,0.1); }
.filter-btn.active {
  background: var(--accent);
  color: #000;
  border-color: var(--accent);
  font-weight: 600;
}

.chord-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 12px;
}
.chord-section-header {
  grid-column: 1 / -1;
  font-size: 1em;
  font-weight: 700;
  color: var(--accent);
  padding: 12px 0 4px;
  border-bottom: 1px solid rgba(255,255,255,0.1);
  margin-top: 8px;
}
.chord-section-header:first-child { margin-top: 0; }
.load-more-sentinel { height: 1px; }
.chord-card {
  background: rgba(255,255,255,0.06);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: var(--radius);
  padding: 12px;
  text-align: center;
  cursor: pointer;
  transition: var(--transition);
}
.chord-card:hover, .chord-card:active {
  background: var(--card-hover);
  transform: translateY(-2px);
  box-shadow: var(--shadow);
}
.chord-card .chord-name {
  font-size: 1.2em;
  font-weight: 700;
  margin-bottom: 8px;
  color: var(--accent);
}
.chord-card svg { width: 100%; max-width: 120px; }
.chord-card .chord-type {
  font-size: 0.75em;
  color: var(--text-dim);
  margin-top: 6px;
}
</style>
<style>
/* ========== 游戏界面 ========== */
.game-top {
  flex-shrink: 0;
}
.game-question-area {
  flex: 1.2;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  min-height: 0;
  overflow: hidden;
}
.game-options-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-height: 0;
}
/* 模式微调比例 */
.mode-quiz .game-question-area { flex: 1.3; }
.mode-quiz .game-options-area { flex: 1; }
.mode-reverse .game-question-area { flex: 1; }
.mode-reverse .game-options-area { flex: 1.2; }
.mode-speed .game-question-area { flex: 1.2; }
.mode-speed .game-options-area { flex: 1; }
.game-header {
  text-align: center;
  margin-bottom: 8px;
}
.game-header .question-label {
  font-size: 0.85em;
  color: var(--text-dim);
  margin-bottom: 6px;
}
.game-header .question-text {
  font-size: 1.4em;
  font-weight: 700;
}
.game-header .question-text.chord-display {
  display: flex;
  justify-content: center;
}
.chord-svg-container {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 0;
  overflow: hidden;
  width: 100%;
}
.chord-svg-container svg {
  max-width: 100%;
  max-height: 100%;
  width: auto;
  height: auto;
}

/* ========== 进度条 ========== */
.game-progress {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 8px;
}
.progress-bar {
  flex: 1;
  height: 8px;
  background: rgba(255,255,255,0.1);
  border-radius: 4px;
  overflow: hidden;
}
.progress-bar .fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--primary));
  border-radius: 4px;
  transition: width 0.5s ease;
}
.progress-text {
  font-size: 0.85em;
  color: var(--text-dim);
  font-weight: 600;
  white-space: nowrap;
}

/* ========== 计时条 ========== */
.timer-bar {
  height: 6px;
  background: rgba(255,255,255,0.1);
  border-radius: 3px;
  overflow: hidden;
  margin-bottom: 8px;
}
.timer-bar .fill {
  height: 100%;
  background: var(--success);
  border-radius: 3px;
  transition: width 1s linear;
}
.timer-bar .fill.warning { background: var(--accent); }
.timer-bar .fill.danger { background: var(--primary); }

/* ========== 选项网格 ========== */
.options-grid {
  flex: 1;
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
  min-height: 0;
}
.option-btn {
  background: rgba(255,255,255,0.06);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: var(--radius);
  padding: 10px 12px;
  text-align: center;
  cursor: pointer;
  transition: var(--transition);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 0;
}
.option-btn svg {
  max-width: 100%;
  max-height: 100%;
}
.option-btn:hover {
  background: var(--card-hover);
  transform: translateY(-2px);
  box-shadow: var(--shadow);
}
.option-btn:active { transform: scale(0.97); }
.option-btn .opt-name {
  font-size: 1.2em;
  font-weight: 700;
  color: var(--accent);
  margin-bottom: 4px;
}
.option-btn.correct {
  background: rgba(39,174,96,0.25);
  border-color: var(--success);
  box-shadow: 0 0 20px rgba(39,174,96,0.3);
}
.option-btn.wrong {
  background: rgba(231,76,60,0.25);
  border-color: var(--primary);
  animation: shake 0.4s ease;
}

/* ========== 结果页 ========== */
.result-screen {
  text-align: center;
  padding: 30px 0;
}
.result-screen .big-score {
  font-size: 3.5em;
  font-weight: 900;
  color: var(--accent);
  margin: 8px 0;
}
.result-screen .score-label {
  font-size: 0.95em;
  color: var(--text-dim);
  margin-bottom: 20px;
}
.result-details {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin-bottom: 24px;
}
.result-detail {
  text-align: center;
  padding: 12px;
  background: rgba(255,255,255,0.06);
  border-radius: var(--radius);
  min-width: 80px;
}
.result-detail .num {
  font-size: 1.4em;
  font-weight: 700;
}
.result-detail .lbl {
  font-size: 0.75em;
  color: var(--text-dim);
  margin-top: 4px;
}
.result-detail.green .num { color: var(--success); }
.result-detail.red .num { color: var(--primary); }
.result-detail.yellow .num { color: var(--accent); }

/* ========== 按钮 ========== */
.btn {
  padding: 12px 24px;
  border: none;
  border-radius: var(--radius);
  font-size: 1em;
  font-weight: 600;
  cursor: pointer;
  transition: var(--transition);
}
.btn-primary {
  background: linear-gradient(135deg, var(--accent), var(--primary));
  color: #fff;
}
.btn-primary:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
.btn-secondary {
  background: rgba(255,255,255,0.1);
  color: var(--text);
  border: 1px solid rgba(255,255,255,0.15);
}
.btn-secondary:hover { background: rgba(255,255,255,0.2); }
.btn-group {
  display: flex;
  gap: 12px;
  justify-content: center;
  margin-top: 20px;
}

/* ========== 难度选择 ========== */
.difficulty-selector {
  display: flex;
  gap: 10px;
  margin: 16px 0;
}
.diff-btn {
  flex: 1;
  padding: 12px 8px;
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: var(--radius);
  background: rgba(255,255,255,0.06);
  color: var(--text);
  cursor: pointer;
  transition: var(--transition);
  text-align: center;
}
.diff-btn .diff-label {
  font-weight: 600;
  font-size: 0.9em;
  display: block;
}
.diff-btn .diff-desc {
  font-size: 0.7em;
  color: var(--text-dim);
  margin-top: 4px;
}
.diff-btn:hover { background: rgba(255,255,255,0.12); }
.diff-btn.active-easy {
  background: rgba(39,174,96,0.2);
  border-color: var(--success);
  color: var(--success);
}
.diff-btn.active-medium {
  background: rgba(243,156,18,0.2);
  border-color: var(--accent);
  color: var(--accent);
}
.diff-btn.active-hard {
  background: rgba(231,76,60,0.2);
  border-color: var(--primary);
  color: var(--primary);
}

/* ========== 速度统计 ========== */
.speed-stats {
  display: flex;
  justify-content: center;
  gap: 12px;
  margin-top: 6px;
  flex-shrink: 0;
}
.speed-stat {
  text-align: center;
  padding: 4px 12px;
  background: rgba(255,255,255,0.06);
  border-radius: var(--radius);
}
.speed-stat .val {
  font-size: 1.3em;
  font-weight: 700;
  color: var(--accent);
}
.speed-stat .lbl {
  font-size: 0.75em;
  color: var(--text-dim);
}

/* ========== 动画 ========== */
@keyframes correctPulse {
  0% { box-shadow: 0 0 0 0 rgba(39,174,96,0.4); }
  100% { box-shadow: 0 0 20px 10px rgba(39,174,96,0); }
}
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-8px); }
  50% { transform: translateX(8px); }
  75% { transform: translateX(-4px); }
}
</style>
<style>
/* ========== 模态框 ========== */
.modal-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(4px);
  z-index: 200;
  align-items: center;
  justify-content: center;
  padding: 16px;
}
.modal-overlay.show { display: flex; }
.modal-box {
  background: linear-gradient(135deg, var(--bg2), var(--bg3));
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 16px;
  padding: 24px;
  max-width: 400px;
  width: 100%;
  max-height: 90vh;
  overflow-y: auto;
  position: relative;
}
.modal-box .close-btn {
  position: absolute;
  top: 12px; right: 12px;
  background: rgba(255,255,255,0.1);
  border: none;
  color: var(--text);
  width: 32px; height: 32px;
  border-radius: 50%;
  font-size: 1.2em;
  cursor: pointer;
  transition: var(--transition);
}
.modal-box .close-btn:hover { background: rgba(255,255,255,0.2); }
.modal-box h2 {
  text-align: center;
  color: var(--accent);
  margin-bottom: 16px;
  font-size: 1.6em;
}
.modal-box .chord-svg-wrap {
  display: flex;
  justify-content: center;
  margin-bottom: 16px;
}
.modal-box .chord-svg-wrap svg { width: 200px; }

/* ========== 和弦信息表 ========== */
.chord-info-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.9em;
}
.chord-info-table th, .chord-info-table td {
  padding: 8px 12px;
  border-bottom: 1px solid rgba(255,255,255,0.08);
  text-align: left;
}
.chord-info-table th { color: var(--text-dim); }
.chord-info-table td { color: var(--text); }
.finger-dot {
  display: inline-block;
  width: 18px; height: 18px;
  border-radius: 50%;
  text-align: center;
  line-height: 18px;
  font-size: 0.75em;
  font-weight: 700;
  margin: 0 2px;
}
.finger-1 { background: #e74c3c; color: #fff; }
.finger-2 { background: #3498db; color: #fff; }
.finger-3 { background: #2ecc71; color: #fff; }
.finger-4 { background: #f39c12; color: #fff; }
.string-label { color: var(--text-dim); font-size: 0.8em; }
.tip-box {
  background: rgba(243,156,18,0.15);
  border-left: 3px solid var(--accent);
  padding: 10px 14px;
  border-radius: 0 8px 8px 0;
  margin-top: 14px;
  font-size: 0.85em;
  color: var(--text-dim);
}

/* ========== 相似和弦 ========== */
.similar-section {
  margin-top: 16px;
  padding-top: 12px;
  border-top: 1px solid rgba(255,255,255,0.1);
}
.similar-title {
  font-weight: 700;
  color: var(--accent);
  font-size: 0.9em;
  margin-bottom: 10px;
}
.similar-grid {
  display: flex;
  gap: 10px;
  overflow-x: auto;
}
.similar-chord-card {
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 8px;
  padding: 8px;
  text-align: center;
  cursor: pointer;
  transition: var(--transition);
  min-width: 70px;
}
.similar-chord-card:hover {
  background: var(--card-hover);
  transform: translateY(-2px);
}
.similar-chord-card svg { width: 60px; }
.similar-name {
  font-size: 0.85em;
  font-weight: 700;
  color: var(--accent);
  margin-top: 4px;
}

/* ========== Toast ========== */
.toast {
  position: fixed;
  top: 60px;
  left: 50%;
  transform: translateX(-50%) translateY(-20px);
  padding: 10px 24px;
  border-radius: 8px;
  font-size: 0.95em;
  font-weight: 600;
  z-index: 300;
  opacity: 0;
  transition: all 0.3s ease;
  pointer-events: none;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.success { background: rgba(39,174,96,0.9); color: #fff; }
.toast.error { background: rgba(231,76,60,0.9); color: #fff; }
.toast.info { background: rgba(52,152,219,0.9); color: #fff; }

/* ========== 星星评级 ========== */
.stars { font-size: 2em; margin: 10px 0; }
.stars .star { color: rgba(255,255,255,0.15); transition: color 0.3s; }
.stars .star.filled { color: var(--accent); }

/* ========== 连击显示 ========== */
.combo-display {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 3em;
  font-weight: 900;
  color: var(--accent);
  pointer-events: none;
  opacity: 0;
  z-index: 150;
  text-shadow: 0 0 20px rgba(243,156,18,0.5);
}
.combo-display.show {
  animation: comboAnim 0.8s ease forwards;
}
</style>
<style>
/* ========== 入场动画 ========== */
.fade-in {
  animation: fadeIn 0.4s ease;
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

.slide-up {
  animation: slideUp 0.5s ease;
}
@keyframes slideUp {
  from { opacity: 0; transform: translateY(30px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ========== 页面切换 ========== */
.page.slide-in {
  animation: slideIn 0.35s ease;
}
@keyframes slideIn {

<script>
// ===================== 持久化存储 =====================
const Storage = {
  KEY: 'gtmaster_stats',

  _load() {
    try {
      return JSON.parse(localStorage.getItem(this.KEY)) || {};
    } catch { return {}; }
  },

  _save(data) {
    localStorage.setItem(this.KEY, JSON.stringify(data));
  },

  getChordStats(name) {
    const data = this._load();
    return data[name] || { correct: 0, wrong: 0, total: 0 };
  },

  recordAnswer(name, isCorrect) {
    const data = this._load();
    if (!data[name]) data[name] = { correct: 0, wrong: 0, total: 0 };
    data[name].total++;
    if (isCorrect) data[name].correct++;
    else data[name].wrong++;
    this._save(data);
  },

  getWeakChords(threshold) {
    const data = this._load();
    const results = [];
    for (const [name, stats] of Object.entries(data)) {
      if (stats.total === 0) continue;
      const errorRate = stats.wrong / stats.total;
      if (errorRate > threshold) {
        results.push({ name, errorRate, ...stats });
      }
    }
    results.sort((a, b) => b.errorRate - a.errorRate);
    return results;
  },

  clearStats() {
    localStorage.removeItem(this.KEY);
  },
};

</script>

// 半音移调音符名映射 (从C开始)
const NOTE_NAMES_SHARP = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const NOTE_NAMES_FLAT = ['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];

function transposeNote(note, semitones) {
  const idx = NOTE_NAMES_SHARP.indexOf(note);
  if (idx === -1) {
    // 可能是降号名，查找在flat列表
    const flatIdx = NOTE_NAMES_FLAT.indexOf(note);
    if (flatIdx === -1) return note;
    return NOTE_NAMES_FLAT[(flatIdx + semitones) % 12];
  }
  // 大调/五声用升号，布鲁斯/小调用降号
  const targetIdx = (idx + semitones) % 12;
  if (semitones >= 3) return NOTE_NAMES_FLAT[targetIdx]; // 超过3个半音倾向用降号
  return NOTE_NAMES_SHARP[targetIdx];
}

// 生成所有音阶
function generateAllScales() {
  const scales = [];
  SCALE_TYPES.forEach(type => {
    SCALE_ROOTS.forEach(root => {
      const shift = ROOT_SEMITONES[root];
      if (shift === 0) {
        // C调直接用模板数据
        scales.push({
          id: `${type.id}-${root}`,
          name: `${root}${type.nameSuffix}`,
          root,
          category: type.category,
          intervals: type.intervals,
          notes: type.notes,
          tip: type.tip,
          positions: type.positions.map(pos => ({
            startFret: pos.startFret,
            strings: pos.strings.map(strNotes => strNotes.map(n => ({
              f: n.f,
              d: n.d,
              n: n.n,
              isRoot: n.n === root
            })))
          }))
        });
      } else {
        // 其他调：品位平移
        scales.push({
          id: `${type.id}-${root}`,
          name: `${root}${type.nameSuffix}`,
          root,
          category: type.category,
          intervals: type.intervals,
          notes: type.notes.map(n => transposeNote(n, shift)),
          tip: type.tip,
          positions: type.positions.map(pos => ({
            startFret: pos.startFret + shift,
            strings: pos.strings.map(strNotes => strNotes.map(n => ({
              f: n.f === 0 ? n.f : n.f + shift,
              d: n.d,
              n: transposeNote(n.n, shift),
              isRoot: transposeNote(n.n, shift) === root
            })))
          }))
        });
      }
    });
  });
  return scales;
}

<script>
// ===================== 音效引擎 (Web Audio API) =====================
const SFX = {
  ctx: null,
  muted: false,
  masterGain: null,

  init() {
    if (this.ctx) return;
    try {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      this.masterGain = this.ctx.createGain();
      this.masterGain.gain.value = 0.35;
      this.masterGain.connect(this.ctx.destination);
    } catch(e) { console.warn('Web Audio API not supported'); }
  },

  resume() {
    if (this.ctx && this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
  },

  // 播放单个音符
  playNote(freq, startTime, duration, type = 'triangle', volume = 0.5) {
    if (!this.ctx || this.muted) return;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, startTime);
    gain.gain.setValueAtTime(volume, startTime);
    gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
    osc.connect(gain);
    gain.connect(this.masterGain);
    osc.start(startTime);
    osc.stop(startTime + duration);
  },

  // 吉他拨弦模拟 — 加入噪声冲击模拟拨弦触感
  playGuitarString(freq, startTime, duration, volume = 0.4) {
    if (!this.ctx || this.muted) return;
    const t = startTime;
    // 噪声冲击 (模拟拨弦瞬间)
    const bufSize = this.ctx.sampleRate * 0.04; // 40ms 噪声
    const noiseBuf = this.ctx.createBuffer(1, bufSize, this.ctx.sampleRate);
    const data = noiseBuf.getChannelData(0);
    for (let i = 0; i < bufSize; i++) data[i] = (Math.random() * 2 - 1) * 0.8;
    const noiseNode = this.ctx.createBufferSource();
    noiseNode.buffer = noiseBuf;
    const noiseGain = this.ctx.createGain();
    noiseGain.gain.setValueAtTime(volume * 0.5, t);
    noiseGain.gain.exponentialRampToValueAtTime(0.001, t + 0.04);
    const noiseFilter = this.ctx.createBiquadFilter();
    noiseFilter.type = 'bandpass';
    noiseFilter.frequency.setValueAtTime(freq * 2, t);
    noiseFilter.Q.setValueAtTime(2, t);
    noiseNode.connect(noiseFilter);
    noiseFilter.connect(noiseGain);
    noiseGain.connect(this.masterGain);
    noiseNode.start(t);
    noiseNode.stop(t + 0.05);

    // 泛音叠加 (模拟钢弦音色)
    const harmonics = [1, 2, 3, 4, 5, 6];
    const volumes = [1, 0.45, 0.22, 0.10, 0.05, 0.03];
    harmonics.forEach((h, i) => {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = i === 0 ? 'triangle' : 'sine';
      const hf = freq * h + (Math.random() - 0.5) * 0.5; // 微偏移模拟真实弦
      osc.frequency.setValueAtTime(hf, t);
      const vol = volume * volumes[i];
      // 更真实的衰减: 快速初始衰减 + 长尾音
      gain.gain.setValueAtTime(vol, t);
      gain.gain.exponentialRampToValueAtTime(vol * 0.3, t + duration * 0.15);
      gain.gain.exponentialRampToValueAtTime(0.001, t + duration);
      osc.connect(gain);
      gain.connect(this.masterGain);
      osc.start(t);
      osc.stop(t + duration);
    });
  },

  // ✅ 正确音效 - 悦耳上行和弦 (C-E-G)
  correct() {
    this.init(); this.resume();
    if (!this.ctx || this.muted) return;
    const t = this.ctx.currentTime;
    this.playGuitarString(261.63, t, 0.5, 0.35);       // C4
    this.playGuitarString(329.63, t + 0.08, 0.5, 0.3); // E4
    this.playGuitarString(392.00, t + 0.16, 0.6, 0.3); // G4
    this.playGuitarString(523.25, t + 0.24, 0.7, 0.2); // C5
  },

  // ❌ 错误音效 - 低沉不协和
  wrong() {
    this.init(); this.resume();
    if (!this.ctx || this.muted) return;
    const t = this.ctx.currentTime;
    this.playNote(180, t, 0.3, 'sawtooth', 0.2);
    this.playNote(185, t, 0.3, 'sawtooth', 0.2);
    this.playNote(120, t + 0.1, 0.4, 'sawtooth', 0.15);
  },

  // 🔥 连击音效 - 根据连击数升级
  combo(count) {
    this.init(); this.resume();
    if (!this.ctx || this.muted) return;
    const t = this.ctx.currentTime;
    // 连击越高，音越高越华丽
    const baseFreq = 440 + Math.min(count, 10) * 60;
    this.playNote(baseFreq, t, 0.15, 'triangle', 0.35);
    this.playNote(baseFreq * 1.25, t + 0.06, 0.15, 'triangle', 0.3);
    this.playNote(baseFreq * 1.5, t + 0.12, 0.2, 'triangle', 0.25);
    if (count >= 5) {
      this.playNote(baseFreq * 2, t + 0.18, 0.25, 'sine', 0.2);
    }
    if (count >= 8) {
      this.playNote(baseFreq * 2.5, t + 0.24, 0.3, 'sine', 0.15);
    }
  },

  // 🎮 游戏开始 - 上行琶音
  gameStart() {
    this.init(); this.resume();
    if (!this.ctx || this.muted) return;
    const t = this.ctx.currentTime;
    const notes = [261.63, 329.63, 392.00, 523.25, 659.25]; // C E G C5 E5
    notes.forEach((freq, i) => {
      this.playGuitarString(freq, t + i * 0.08, 0.6, 0.3);
    });
  },

  // 🏆 游戏结束 - 胜利号角
  gameComplete() {
    this.init(); this.resume();
    if (!this.ctx || this.muted) return;
    const t = this.ctx.currentTime;
    // 上行大三和弦 + 高音结尾
    this.playGuitarString(261.63, t, 0.8, 0.3);        // C4
    this.playGuitarString(329.63, t + 0.15, 0.8, 0.25);// E4
    this.playGuitarString(392.00, t + 0.30, 0.8, 0.25);// G4
    this.playGuitarString(523.25, t + 0.45, 1.0, 0.35);// C5
    this.playGuitarString(659.25, t + 0.55, 1.2, 0.3); // E5
    // 最后一个长音
    this.playNote(1046.5, t + 0.65, 1.5, 'sine', 0.15);
  },

  // ⏱ 倒计时滴答 (最后10秒)
  tick() {
    this.init(); this.resume();
    if (!this.ctx || this.muted) return;
    const t = this.ctx.currentTime;
    this.playNote(880, t, 0.06, 'square', 0.1);
  },

  // ⏱ 时间紧迫警告 (最后5秒)
  tickUrgent() {
    this.init(); this.resume();
    if (!this.ctx || this.muted) return;
    const t = this.ctx.currentTime;
    this.playNote(1200, t, 0.1, 'square', 0.15);
    this.playNote(1400, t + 0.1, 0.1, 'square', 0.12);
  },

  // 🖱 按钮点击 - 轻柔反馈
  click() {
    this.init(); this.resume();
    if (!this.ctx || this.muted) return;
    const t = this.ctx.currentTime;
    this.playNote(600, t, 0.04, 'sine', 0.15);
    this.playNote(800, t + 0.02, 0.04, 'sine', 0.1);
  },

  // 🎸 和弦拨弦试听 (图鉴模式点击和弦时) — 自然扫弦
  strumChord(chord) {
    this.init(); this.resume();
    if (!this.ctx || this.muted) return;
    // 标准吉他调弦频率: E2 A2 D3 G3 B3 E4
    const stringFreqs = [82.41, 110.00, 146.83, 196.00, 246.94, 329.63];
    const t = this.ctx.currentTime;
    // 依次拨弦，从低到高模拟下拨扫弦
    let strumDelay = 0;
    chord.frets.forEach((fret, i) => {
      if (fret === -1) {
        // 闷音: 短促的"thud"声
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(stringFreqs[i] * 0.5, t + strumDelay);
        gain.gain.setValueAtTime(0.15, t + strumDelay);
        gain.gain.exponentialRampToValueAtTime(0.001, t + strumDelay + 0.08);
        osc.connect(gain); gain.connect(this.masterGain);
        osc.start(t + strumDelay); osc.stop(t + strumDelay + 0.1);
      } else {
        const freq = stringFreqs[i] * Math.pow(2, fret / 12);
        // 自然时序: 每弦间隔30-50ms随机，模拟真人扫弦
        this.playGuitarString(freq, t + strumDelay, 1.4, 0.28 + Math.random() * 0.06);
      }
      strumDelay += 0.03 + Math.random() * 0.02;
    });
  },

  // ⏰ 时间到!
  timeUp() {
    this.init(); this.resume();
    if (!this.ctx || this.muted) return;
    const t = this.ctx.currentTime;
    this.playNote(600, t, 0.2, 'square', 0.2);
    this.playNote(500, t + 0.2, 0.2, 'square', 0.2);
    this.playNote(400, t + 0.4, 0.5, 'square', 0.2);
  },

  // 🌟 星星出现
  starReveal() {
    this.init(); this.resume();
    if (!this.ctx || this.muted) return;
    const t = this.ctx.currentTime;
    this.playNote(880, t, 0.1, 'sine', 0.2);
    this.playNote(1100, t + 0.08, 0.15, 'sine', 0.15);
  },

  // 🎸 音阶逐音符播放
  playScale(scale, positionIdx = 0, interval = 150) {
    this.init(); this.resume();
    if (!this.ctx || this.muted) return;
    const stringFreqs = [82.41, 110.00, 146.83, 196.00, 246.94, 329.63];
    const pos = scale.positions[positionIdx];
    if (!pos) return;

    // 收集所有音符（从低弦到高弦，按品位升序）
    const allNotes = [];
    for (let si = 0; si < 6; si++) {
      const strNotes = pos.strings[si];
      strNotes.forEach(n => {
        if (n.f >= 0) {
          const freq = stringFreqs[si] * Math.pow(2, n.f / 12);
          allNotes.push({ freq, isRoot: n.isRoot });
        }
      });
    }

    // 按频率排序（上行）
    allNotes.sort((a, b) => a.freq - b.freq);

    const t = this.ctx.currentTime;
    allNotes.forEach((note, i) => {
      const vol = note.isRoot ? 0.35 : 0.25;
      this.playGuitarString(note.freq, t + i * interval / 1000, 0.5, vol);
    });
  },

  // 🎸 播放单个音阶音符（引导弹奏用）
  playScaleNote(scale, positionIdx, stringIdx, noteIdx) {
    this.init(); this.resume();
    if (!this.ctx || this.muted) return;
    const stringFreqs = [82.41, 110.00, 146.83, 196.00, 246.94, 329.63];
    const pos = scale.positions[positionIdx];
    if (!pos) return;
    const note = pos.strings[stringIdx][noteIdx];
    if (!note || note.f < 0) return;
    const freq = stringFreqs[stringIdx] * Math.pow(2, note.f / 12);
    const vol = note.isRoot ? 0.4 : 0.3;
    this.playGuitarString(freq, this.ctx.currentTime, 0.6, vol);
  },

  // 🔇 静音切换
  toggleMute() {
    this.muted = !this.muted;
    if (this.masterGain) {
      this.masterGain.gain.value = this.muted ? 0 : 0.35;
    }
    const btn = document.getElementById('soundToggle');
    if (btn) {
      btn.textContent = this.muted ? '🔇' : '🔊';
      btn.classList.toggle('muted', this.muted);
    }
  }
};

function toggleSound() {
  SFX.init();
  SFX.toggleMute();
}

</script>
<script>
// ===================== SVG 和弦图渲染 =====================
function renderChordSVG(chord, size = 120, showFingers = true) {
  const w = size, h = size * 1.3;
  const startX = 25, startY = 28;
  const stringSpacing = (w - 50) / 5;
  const fretSpacing = (h - 55) / 5;
  const dotR = stringSpacing * 0.32;

  let svg = `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" style="display:block;">`;

  // 琴颈木纹背景
  svg += `<defs>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3a2a1a"/><stop offset="30%" stop-color="#4a3a2a"/>
      <stop offset="60%" stop-color="#3d2d1d"/><stop offset="100%" stop-color="#4a3a2a"/>
    </linearGradient>
    <linearGradient id="fretMetal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c0c0c0"/><stop offset="50%" stop-color="#e8e8e8"/>
      <stop offset="100%" stop-color="#a0a0a0"/>
    </linearGradient>
    <filter id="dotGlow"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-opacity="0.5"/></filter>
    <filter id="nutShadow"><feDropShadow dx="0" dy="1" stdDeviation="0.5" flood-opacity="0.3"/></filter>
  </defs>`;

  // 琴颈面板
  svg += `<rect x="${startX-4}" y="${startY-2}" width="${stringSpacing*5+8}" height="${fretSpacing*5+6}" rx="3" fill="url(#wood)"/>`;
  // 木纹细线
  for (let i = 0; i < 8; i++) {
    const y = startY + fretSpacing * 0.5 * i + 3;
    svg += `<line x1="${startX-2}" y1="${y}" x2="${startX + stringSpacing*5+2}" y2="${y}" stroke="rgba(255,255,255,0.04)" stroke-width="0.5"/>`;
  }

  // 品位号
  if (chord.baseFret > 1) {
    svg += `<text x="8" y="${startY + fretSpacing/2 + 4}" fill="#f39c12" font-size="11" font-weight="700">${chord.baseFret}fr</text>`;
  }

  // 琴枕 (3D效果)
  if (chord.baseFret === 1) {
    svg += `<rect x="${startX-3}" y="${startY-5}" width="${stringSpacing*5+6}" height="6" rx="2" fill="#ddd" filter="url(#nutShadow)"/>`;
    svg += `<line x1="${startX-3}" y1="${startY-3}" x2="${startX + stringSpacing*5+3}" y2="${startY-3}" stroke="#aaa" stroke-width="0.5"/>`;
  }

  // 品位线 (金属质感)
  for (let i = 0; i <= 5; i++) {
    const y = startY + i * fretSpacing;
    const fw = i === 0 ? 3 : 2.5;
    svg += `<rect x="${startX-1}" y="${y - fw/2}" width="${stringSpacing*5+2}" height="${fw}" rx="1" fill="url(#fretMetal)"/>`;
  }

  // 琴弦 (金属质感,低音弦更粗)
  for (let i = 0; i < 6; i++) {
    const x = startX + i * stringSpacing;
    const sw = 1.8 - i * 0.18;
    const col = i < 3 ? '#d4d4d4' : '#bbb';
    svg += `<line x1="${x}" y1="${startY}" x2="${x}" y2="${startY + fretSpacing*5}" stroke="${col}" stroke-width="${sw}" stroke-linecap="round"/>`;
  }

  // 弦名标记
  const stringNames = ['E','A','D','G','B','e'];
  for (let i = 0; i < 6; i++) {
    const x = startX + i * stringSpacing;
    svg += `<text x="${x}" y="${startY - 10}" text-anchor="middle" fill="#95a5a6" font-size="10">${stringNames[i]}</text>`;
  }

  // 手指位置和标记
  for (let i = 0; i < 6; i++) {
    const x = startX + i * stringSpacing;
    const fret = chord.frets[i];
    const finger = chord.fingers[i];

    if (fret === -1) {
      // 闷音 ✕
      svg += `<text x="${x}" y="${startY + fretSpacing*5 + 16}" text-anchor="middle" fill="#e74c3c" font-size="12" font-weight="700">✕</text>`;
    } else if (fret === 0) {
      // 开放弦 ○
      svg += `<circle cx="${x}" cy="${startY + fretSpacing*5 + 10}" r="${dotR*0.7}" fill="none" stroke="#27ae60" stroke-width="1.5"/>`;
    } else {
      // 按弦位置
      const fretIndex = chord.baseFret === 1 ? fret : fret - chord.baseFret + 1;
      const y = startY + (fretIndex - 0.5) * fretSpacing;
      const colors = ['', '#e74c3c', '#3498db', '#2ecc71', '#f39c12'];
      const fillColor = showFingers && finger > 0 && finger <= 4 ? colors[finger] : '#ecf0f1';
      // 带阴影的指法圆点
      svg += `<circle cx="${x}" cy="${y}" r="${dotR + 1}" fill="rgba(0,0,0,0.3)" filter="url(#dotGlow)"/>`;
      svg += `<circle cx="${x}" cy="${y}" r="${dotR}" fill="${fillColor}"/>`;
      if (showFingers && finger > 0 && finger <= 4) {
        svg += `<text x="${x}" y="${y + 4}" text-anchor="middle" fill="#fff" font-size="${dotR*1.3}" font-weight="700">${finger}</text>`;
      }
    }
  }

  svg += '</svg>';
  return svg;
}

// ===================== 音阶指板图渲染 =====================
function renderScaleSVG(scale, positionIdx = 0, viewType = 'position', size = 160) {
  const pos = scale.positions[positionIdx];
  if (!pos) return '';

  if (viewType === 'position') {
    return renderScalePositionSVG(scale, pos, size);
  } else {
    return renderScaleFullSVG(scale, positionIdx, size);
  }
}

function renderScalePositionSVG(scale, pos, size) {
  // 把位视图: 显示 pos.startFret 到 startFret+5 的 6 品位区间
  const fretCount = 6;
  const w = size, h = size * 0.65;
  const pad = 28;
  const strSpacing = (w - 2 * pad) / 5;
  const fretSpacing = (h - 28) / fretCount;
  const dotR = strSpacing * 0.28;

  let svg = `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" style="display:block;">`;

  // 背景面板
  svg += `<rect x="${pad-3}" y="10" width="${strSpacing*5+6}" height="${fretSpacing*fretCount+4}" rx="3" fill="#3a2a1a"/>`;

  // 品位号
  if (pos.startFret > 0) {
    svg += `<text x="12" y="${10 + fretSpacing/2 + 4}" fill="#f39c12" font-size="11" font-weight="700">${pos.startFret}fr</text>`;
  }

  // 品位线
  for (let i = 0; i <= fretCount; i++) {
    const y = 10 + i * fretSpacing;
    const fw = i === 0 ? 3 : 2.5;
    svg += `<rect x="${pad-1}" y="${y-fw/2}" width="${strSpacing*5+2}" height="${fw}" rx="1" fill="#c8c0b0"/>`;
  }

  // 琴枕
  if (pos.startFret === 0) {
    svg += `<rect x="${pad-3}" y="8" width="${strSpacing*5+6}" height="5" rx="2" fill="#ddd"/>`;
  }

  // 弦名标记
  const strNames = ['E','A','D','G','B','e'];
  for (let i = 0; i < 6; i++) {
    const x = pad + i * strSpacing;
    svg += `<text x="${x}" y="6" text-anchor="middle" fill="#95a5a6" font-size="9">${strNames[i]}</text>`;
  }

  // 琴弦
  for (let i = 0; i < 6; i++) {
    const x = pad + i * strSpacing;
    const sw = 1.8 - i * 0.18;
    svg += `<line x1="${x}" y1="10" x2="${x}" y2="${10+fretSpacing*fretCount}" stroke="#c0b090" stroke-width="${sw}"/>`;
  }

  // 音符圆点
  const stringData = pos.strings;
  for (let si = 0; si < 6; si++) {
    const x = pad + si * strSpacing;
    const notes = stringData[5 - si]; // stringData 是从低弦到高弦
    for (const note of notes) {
      const relFret = pos.startFret === 0 ? note.f : note.f - pos.startFret;
      if (relFret < 0 || relFret > fretCount) continue;
      const y = 10 + (relFret === 0 ? -4 : (relFret - 0.5) * fretSpacing);

      if (note.isRoot) {
        svg += `<circle cx="${x}" cy="${y}" r="${dotR+1.5}" fill="#e74c3c"/>`;
        svg += `<text x="${x}" y="${y+3}" text-anchor="middle" fill="#fff" font-size="${dotR*1.1}" font-weight="700">R</text>`;
      } else {
        svg += `<circle cx="${x}" cy="${y}" r="${dotR}" fill="#3498db"/>`;
        svg += `<text x="${x}" y="${y+2.5}" text-anchor="middle" fill="#fff" font-size="${dotR*0.9}">${note.d || ''}</text>`;
      }
    }
  }

  svg += '</svg>';
  return svg;
}

function renderScaleFullSVG(scale, activePositionIdx, size) {
  // 全指板视图: 0-12品
  const fretCount = 12;
  const w = size * 1.8, h = size * 0.5;
  const pad = 28;
  const strSpacing = (w - 2 * pad) / 5;
  const fretSpacing = (h - 16) / fretCount;
  const dotR = strSpacing * 0.22;

  let svg = `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" style="display:block;">`;

  // 面板背景
  svg += `<rect x="${pad-3}" y="6" width="${strSpacing*5+6}" height="${fretSpacing*fretCount+4}" rx="3" fill="#3a2a1a"/>`;

  // 品位标记 (每2品)
  for (let f = 1; f <= fretCount; f++) {
    if (f % 2 === 0 || f === 1 || f === 3 || f === 5 || f === 7 || f === 9 || f === 12) {
      svg += `<text x="10" y="${6 + (f-0.5)*fretSpacing + 3}" fill="#95a5a6" font-size="8">${f}</text>`;
    }
  }

  // 琴枕
  svg += `<rect x="${pad-3}" y="4" width="${strSpacing*5+6}" height="4" rx="2" fill="#ddd"/>`;

  // 品位线
  for (let i = 1; i <= fretCount; i++) {
    const y = 6 + i * fretSpacing;
    svg += `<line x1="${pad}" y1="${y}" x2="${pad+strSpacing*5}" y2="${y}" stroke="#c8c0b0" stroke-width="1.5"/>`;
  }

  // 琴弦
  const strNames = ['E','A','D','G','B','e'];
  for (let i = 0; i < 6; i++) {
    const x = pad + i * strSpacing;
    const sw = 1.6 - i * 0.15;
    svg += `<line x1="${x}" y1="6" x2="${x}" y2="${6+fretSpacing*fretCount}" stroke="#c0b090" stroke-width="${sw}"/>`;
    svg += `<text x="${x}" y="3" text-anchor="middle" fill="#95a5a6" font-size="7">${strNames[i]}</text>`;
  }

  // 所有把位的音符 (当前把位彩色，其他灰色)
  scale.positions.forEach((pos, pi) => {
    const isActive = pi === activePositionIdx;
    const stringData = pos.strings;
    for (let si = 0; si < 6; si++) {
      const x = pad + si * strSpacing;
      const notes = stringData[5 - si];
      for (const note of notes) {
        if (note.f < 0 || note.f > fretCount) continue;
        const y = 6 + (note.f === 0 ? -3 : (note.f - 0.5) * fretSpacing);

        if (isActive) {
          if (note.isRoot) {
            svg += `<circle cx="${x}" cy="${y}" r="${dotR+1}" fill="#e74c3c"/>`;
            svg += `<text x="${x}" y="${y+2}" text-anchor="middle" fill="#fff" font-size="${dotR*0.8}" font-weight="700">R</text>`;
          } else {
            svg += `<circle cx="${x}" cy="${y}" r="${dotR}" fill="#3498db"/>`;
          }
        } else {
          // 非活跃把位: 小灰色圆点
          svg += `<circle cx="${x}" cy="${y}" r="${dotR*0.6}" fill="rgba(255,255,255,0.2)"/>`;
        }
      }
    }
  });

  svg += '</svg>';
  return svg;
}

<script>
// ===================== 页面管理 =====================
let _navForward = true;

function showPage(pageId, direction) {
  _navForward = direction !== 'back';
  const outgoing = document.querySelector('.page.active');
  const incoming = document.getElementById(pageId);
  if (outgoing === incoming) return;

  // Clean up any previous transition classes on all pages
  document.querySelectorAll('.page').forEach(p => {
    p.classList.remove('slide-in', 'slide-in-back', 'slide-out', 'slide-out-back', 'page-leaving');
  });

  // Animate outgoing page: absolute position so it overlays without layout shift
  if (outgoing) {
    const outClass = _navForward ? 'slide-out' : 'slide-out-back';
    outgoing.classList.add(outClass, 'page-leaving');
    let done = false;
    const cleanup = () => {
      if (done) return;
      done = true;
      outgoing.classList.remove('active', 'slide-out', 'slide-out-back', 'page-leaving');
    };
    outgoing.addEventListener('animationend', cleanup);
    setTimeout(cleanup, 400); // safety fallback
  }

  // Animate incoming page
  const inClass = _navForward ? 'slide-in' : 'slide-in-back';
  incoming.classList.add('active', inClass);

  // 返回按钮
  const hasBack = pageId !== 'homePage';
  document.getElementById('topBar').innerHTML = hasBack ?
    `<button class="back-btn ripple-wrap" onclick="goBack()">←</button>
     <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg><span>和弦大师</span></div>
     <div class="stats"><div class="stat-item"><span class="label">得分</span><span class="value" id="totalScore">${gameState.totalScore}</span></div><div class="stat-item"><span class="label">连击</span><span class="value" id="totalCombo">${gameState.combo}</span></div></div>
     <button class="sound-toggle ${SFX.muted?'muted':''}" id="soundToggle" onclick="toggleSound()" title="音效开关">${SFX.muted?'🔇':'🔊'}</button>` :
    `<div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg><span>和弦大师</span></div>
     <div class="stats"><div class="stat-item"><span class="label">得分</span><span class="value" id="totalScore">${gameState.totalScore}</span></div><div class="stat-item"><span class="label">连击</span><span class="value" id="totalCombo">${gameState.combo}</span></div></div>
     <button class="sound-toggle ${SFX.muted?'muted':''}" id="soundToggle" onclick="toggleSound()" title="音效开关">${SFX.muted?'🔇':'🔊'}</button>`;
}

function goBack() {
  if (gameState.timer) { clearInterval(gameState.timer); gameState.timer = null; }
  showPage('homePage', 'back');
}

// ===================== 左滑返回手势 =====================
(function initSwipeBack() {
  let startX = 0, startY = 0, startTime = 0;
  const main = document.querySelector('.main-content');
  if (!main) return;
  main.addEventListener('touchstart', e => {
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
    startTime = Date.now();
  }, { passive: true });
  main.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - startX;
    const dy = e.changedTouches[0].clientY - startY;
    const dt = Date.now() - startTime;
    if (dx < -80 && Math.abs(dy) < 60 && dt < 300) {
      const active = document.querySelector('.page.active');
      if (active && active.id !== 'homePage') goBack();
    }
  }, { passive: true });
})();

// ===================== 和弦图鉴 =====================
let libraryFilter = '全部';
let librarySearch = '';
let groupedView = false;
const PAGE_SIZE = 12;
let libraryFiltered = [];
let libraryLoaded = 0;
let libraryObserver = null;

function renderLibrary() {
  // 筛选栏
  const filterBar = document.getElementById('filterBar');
  const searchActive = librarySearch.length > 0;
  filterBar.innerHTML = CATEGORIES.map(c =>
    `<button class="filter-btn ${(!searchActive && c===libraryFilter)?'active':''}" onclick="filterLibrary('${c}')">${c}</button>`
  ).join('');

  // 滚动到当前 active 的分类按钮
  const activeBtn = filterBar.querySelector('.filter-btn.active');
  if (activeBtn) activeBtn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });

  // 视图切换按钮
  const toggleBtn = document.getElementById('viewToggle');
  toggleBtn.textContent = groupedView ? '⊞' : '☰';
  toggleBtn.classList.toggle('active', groupedView);

  // 计算筛选结果
  if (searchActive) {
    libraryFiltered = CHORDS.filter(c => c.name.toLowerCase().includes(librarySearch.toLowerCase()));
  } else {
    libraryFiltered = libraryFilter === '全部' ? [...CHORDS] : CHORDS.filter(c => c.category === libraryFilter);
  }

  // 重置分页
  libraryLoaded = 0;
  loadMoreChords();
}

function loadMoreChords() {
  const grid = document.getElementById('chordGrid');
  const sentinel = document.getElementById('loadMoreSentinel');

  if (libraryLoaded === 0) {
    grid.innerHTML = '';
  }

  if (libraryFiltered.length === 0) {
    grid.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-dim);">没有找到匹配的和弦</div>';
    sentinel.style.display = 'none';
    return;
  }

  const remaining = libraryFiltered.length - libraryLoaded;
  const batch = Math.min(PAGE_SIZE, remaining);

  if (groupedView && libraryLoaded === 0) {
    // 分组视图：初始渲染时添加分组头
    const openChords = libraryFiltered.filter(c => !c.barre);
    const barreChords = libraryFiltered.filter(c => c.barre);
    let html = '';
    if (openChords.length > 0) {
      html += '<div class="chord-section-header">开放和弦</div>';
      html += renderChordCards(openChords.slice(0, PAGE_SIZE));
      libraryLoaded = Math.min(PAGE_SIZE, openChords.length);
    }
    if (barreChords.length > 0 && libraryLoaded < PAGE_SIZE) {
      html += '<div class="chord-section-header">横按和弦</div>';
      const barreBatch = barreChords.slice(0, PAGE_SIZE - libraryLoaded);
      html += renderChordCards(barreBatch);
      libraryLoaded += barreBatch.length;
    }
    grid.innerHTML = html;
  } else if (groupedView) {
    // 分组视图追加加载：简化处理，直接追加剩余
    grid.innerHTML += renderChordCards(libraryFiltered.slice(libraryLoaded, libraryLoaded + batch));
    libraryLoaded += batch;
  } else {
    // 平铺视图
    const slice = libraryFiltered.slice(libraryLoaded, libraryLoaded + batch);
    grid.innerHTML += renderChordCards(slice);
    libraryLoaded += batch;
  }

  // 控制 sentinel 显示
  if (libraryLoaded >= libraryFiltered.length) {
    sentinel.style.display = 'none';
    disconnectLibraryObserver();
  } else {
    sentinel.style.display = '';
    setupLibraryObserver();
  }
}

function renderChordCards(chords) {
  return chords.map((chord, idx) => {
    const realIdx = CHORDS.indexOf(chord);
    return `<div class="chord-card fade-in" style="animation-delay:${idx*0.03}s" onclick="SFX.strumChord(CHORDS[${realIdx}]);showChordDetail(${realIdx})">
      <div class="chord-name">${chord.name} <span style="font-size:0.6em;opacity:0.5;">🔊</span></div>
      ${renderChordSVG(chord, 100)}
      <div class="chord-type">${chord.category}</div>
    </div>`;
  }).join('');
}

function setupLibraryObserver() {
  if (libraryObserver) return;
  const sentinel = document.getElementById('loadMoreSentinel');
  if (!sentinel) return;
  libraryObserver = new IntersectionObserver(entries => {
    if (entries[0].isIntersecting && libraryLoaded < libraryFiltered.length) {
      loadMoreChords();
    }
  }, { rootMargin: '200px' });
  libraryObserver.observe(sentinel);
}

function disconnectLibraryObserver() {
  if (libraryObserver) {
    libraryObserver.disconnect();
    libraryObserver = null;
  }
}

function toggleLibraryView() {
  groupedView = !groupedView;
  renderLibrary();
}

function filterLibrary(cat) {
  libraryFilter = cat;
  librarySearch = '';
  document.getElementById('chordSearch').value = '';
  disconnectLibraryObserver();
  renderLibrary();
}

function searchLibrary(text) {
  librarySearch = text;
  disconnectLibraryObserver();
  renderLibrary();
}

function showChordDetail(idx) {
  const chord = CHORDS[idx];
  const modal = document.getElementById('chordModal');
  const content = document.getElementById('modalContent');

  const stringNames = ['6弦E','5弦A','4弦D','3弦G','2弦B','1弦e'];
  const fingerColors = ['','finger-1','finger-2','finger-3','finger-4'];

  let tableRows = '';
  for (let i = 0; i < 6; i++) {
    const fret = chord.frets[i];
    const finger = chord.fingers[i];
    const fretText = fret === -1 ? '✕ 闷音' : fret === 0 ? '○ 开放' : `第${fret}品`;
    const fingerText = finger === 0 ? '-' : `<span class="finger-dot ${fingerColors[finger]}">${finger}</span>`;
    tableRows += `<tr><td class="string-label">${stringNames[i]}</td><td>${fretText}</td><td>${fingerText}</td></tr>`;
  }

  // Similar chords section
  let similarHtml = '';
  if (chord.similar && chord.similar.length > 0) {
    const similarCards = chord.similar.map(name => {
      const sChord = CHORDS.find(c => c.name === name);
      if (!sChord) return '';
      const sIdx = CHORDS.indexOf(sChord);
      return `<div class="similar-chord-card" onclick="showChordDetail(${sIdx})">

      </div>`;

    similarHtml = `<div class="similar-section">
      <div class="similar-title">相似和弦</div>
      <div class="similar-grid">${similarCards}</div>
    </div>`;
  }

  content.innerHTML = `
    <button class="close-btn" onclick="closeModal()">✕</button>
    <h2>${chord.name} <button class="btn btn-secondary" style="font-size:0.5em;padding:4px 10px;vertical-align:middle;" onclick="SFX.strumChord(CHORDS[${idx}])">🔊 试听</button></h2>
    <div class="chord-svg-wrap">${renderChordSVG(chord, 180)}</div>
    <table class="chord-info-table">
      <tr><th>弦</th><th>品位</th><th>手指</th></tr>
      ${tableRows}
    </table>
    <div style="margin-top:12px;font-size:0.9em;color:var(--text-dim);">
      类型：${chord.category} | ${chord.type}
      ${chord.baseFret > 1 ? ` | 从第${chord.baseFret}品开始` : ''}
    </div>
    <div class="tip-box">💡 ${chord.tip}</div>
    ${similarHtml}
  `;

  SFX.strumChord(chord);

document.getElementById('chordModal').addEventListener('click', function(e) {

// 模态框滑动关闭
(function() {
  const modal = document.getElementById('chordModal');
  let startY = 0, currentY = 0, dragging = false;
  modal.addEventListener('touchstart', (e) => {
    if (e.target.closest('.modal-box')) return;
  });
  const box = document.getElementById('modalContent');
  box.addEventListener('touchstart', (e) => {
    startY = e.touches[0].clientY; dragging = true;
    box.style.transition = 'none';
  }, { passive: true });
  box.addEventListener('touchmove', (e) => {
    if (!dragging) return;
    currentY = e.touches[0].clientY - startY;
    if (currentY > 0) box.style.transform = `translateY(${currentY}px)`;
  }, { passive: true });
  box.addEventListener('touchend', () => {
    if (!dragging) return;
    dragging = false;
    box.style.transition = 'transform 0.25s ease';
    if (currentY > 80) { closeModal(); box.style.transform = ''; }
    else { box.style.transform = ''; }
    currentY = 0;
  });
})();

function spawnSparkles(cx, cy) {
  const colors = ['#f39c12','#e74c3c','#2ecc71','#3498db','#fff'];
  for (let i = 0; i < 10; i++) {
    const s = document.createElement('div');
    s.className = 'sparkle';
    const angle = (Math.PI * 2 / 10) * i + Math.random() * 0.5;
    const dist = 40 + Math.random() * 50;
    const dx = Math.cos(angle) * dist;
    const dy = Math.sin(angle) * dist;
    s.style.cssText = `left:${cx}px;top:${cy}px;background:${colors[i%colors.length]};--dx:${dx}px;--dy:${dy}px;width:${4+Math.random()*4}px;height:${4+Math.random()*4}px;`;
    document.body.appendChild(s);
    s.addEventListener('animationend', () => s.remove());
  }
}

// 触摸涟漪
function initRipple() {
  document.addEventListener('pointerdown', (e) => {
    const target = e.target.closest('.mode-card, .chord-card, .option-btn, .btn, .filter-btn, .diff-btn, .ripple-wrap');
    if (!target) return;
    const rect = target.getBoundingClientRect();
    const size = Math.max(rect.width, rect.height) * 2;
    const circle = document.createElement('span');
    circle.className = 'ripple-circle';
    circle.style.cssText = `width:${size}px;height:${size}px;left:${e.clientX - rect.left - size/2}px;top:${e.clientY - rect.top - size/2}px;`;
    target.style.position = 'relative';
    target.style.overflow = 'hidden';
    target.appendChild(circle);
    circle.addEventListener('animationend', () => circle.remove());
  });
}

// ===================== 加权随机 =====================
function weightedRandomPool(pool) {
  const weighted = pool.map(chord => {
    const stats = Storage.getChordStats(chord.name);
    const errorRate = stats.total > 0 ? stats.wrong / stats.total : 0;
    return { chord, weight: 1 + errorRate * 3 };
  });
  const totalWeight = weighted.reduce((sum, w) => sum + w.weight, 0);
  const sorted = [];
  const remaining = [...weighted];
  while (remaining.length > 0) {
    let r = Math.random() * remaining.reduce((s, w) => s + w.weight, 0);
    for (let i = 0; i < remaining.length; i++) {
      r -= remaining[i].weight;
      if (r <= 0) {
        sorted.push(remaining[i].chord);
        remaining.splice(i, 1);
        break;
      }
    }
  }
  return sorted;
}

// ===================== 开始游戏 =====================
function startGame() {
  const pool = CHORDS.filter(c => gameState.selectedCategories.includes(c.category));
  if (pool.length < 4) {
    showToast('和弦数量不足，请选择更多分类', 'error');
    return;
  }

  // 生成题目
  gameState.score = 0;
  gameState.combo = 0;
  gameState.maxCombo = 0;
  gameState.correct = 0;
  gameState.wrong = 0;
  gameState.currentQ = 0;
  gameState.answered = false;

  if (gameState.mode === 'speed') {
    gameState.totalQ = 999;
    gameState.timeLeft = 60;
    generateSpeedQuestions(pool);
    showPage('gamePage');
    updateGameLayoutMode();
    SFX.gameStart();
    startSpeedTimer();
    showSpeedQuestion();
  } else {
    gameState.totalQ = 10;
    generateQuestions(pool);
    showPage('gamePage');
    updateGameLayoutMode();
    SFX.gameStart();
    showQuestion();
  }
}

function generateQuestions(pool) {
  gameState.questions = [];
  const shuffled = weightedRandomPool(pool);
  for (let i = 0; i < gameState.totalQ; i++) {
    const correct = shuffled[i % shuffled.length];
    const options = [correct];
    // 生成3个干扰项
    const others = pool.filter(c => c.name !== correct.name).sort(() => Math.random() - 0.5);
    for (let j = 0; j < 3 && j < others.length; j++) {
      options.push(others[j]);
    }
    // 确保有4个选项
    while (options.length < 4) {
      const extra = pool[Math.floor(Math.random() * pool.length)];
      if (!options.find(o => o.name === extra.name)) options.push(extra);
    }
    gameState.questions.push({
      correct,
      options: options.sort(() => Math.random() - 0.5)
    });
  }
}

function generateSpeedQuestions(pool) {
  gameState.questions = [];
  for (let i = 0; i < 200; i++) {
    // Weighted selection for correct chord
    const weighted = pool.map(chord => {
      const stats = Storage.getChordStats(chord.name);
      const errorRate = stats.total > 0 ? stats.wrong / stats.total : 0;
      return { chord, weight: 1 + errorRate * 3 };
    });
    const totalWeight = weighted.reduce((sum, w) => sum + w.weight, 0);
    let r = Math.random() * totalWeight;
    let correct;
    for (const w of weighted) {
      r -= w.weight;
      if (r <= 0) { correct = w.chord; break; }
    }
    if (!correct) correct = pool[0];
    const options = [correct];
    const others = pool.filter(c => c.name !== correct.name).sort(() => Math.random() - 0.5);
    for (let j = 0; j < 3 && j < others.length; j++) {
      options.push(others[j]);
    }
    while (options.length < 4) {
      const extra = pool[Math.floor(Math.random() * pool.length)];
      if (!options.find(o => o.name === extra.name)) options.push(extra);
    }
    gameState.questions.push({
      correct,
      options: options.sort(() => Math.random() - 0.5)
    });
  }
}
