      document.getElementById('gameQuestionLabel').textContent = '听声音，选择正确的指法图';
      questionEl.innerHTML = `<span style="font-size:1.8em;font-weight:700;color:var(--accent);">${q.correct.name}</span>`;
      questionEl.className = 'question-text question-slide-in';
      setTimeout(() => SFX.strumChord(q.correct), 200);

      gridEl.innerHTML = q.options.map((opt, i) =>
        `<div class="option-btn" onclick="answerQuiz(this, ${i})">
          ${renderChordSVG(opt, 80, false)}
        </div>`
      ).join('');
      gridEl.className = 'options-grid question-slide-in';
    }
  }
}

// ===================== 答题 =====================
function answerQuiz(btn, idx) {
  if (gameState.answered) return;
  gameState.answered = true;
  document.getElementById('replayBtn').style.display = 'none';

  const q = gameState.questions[gameState.currentQ];
  const selected = q.options[idx];
  const isCorrect = selected.name === q.correct.name;

  // 标记正确和错误
  const allBtns = document.querySelectorAll('.option-btn');
  allBtns.forEach((b, i) => {
    if (q.options[i].name === q.correct.name) b.classList.add('correct');
  });

  Storage.recordAnswer(q.correct.name, isCorrect);
  if (isCorrect) {
    gameState.correct++;
    gameState.combo++;
    if (gameState.combo > gameState.maxCombo) gameState.maxCombo = gameState.combo;
    const comboBonus = Math.min(gameState.combo, 5);
    const points = 10 + comboBonus * 2;
    gameState.score += points;
    gameState.totalScore += points;

    // 浮动分数
    const rect = btn.getBoundingClientRect();
    showFloatingScore(rect.left + rect.width/2, rect.top, `+${points}`);
    // 粒子特效
    spawnSparkles(rect.left + rect.width/2, rect.top + rect.height/2);
    // 进度条脉冲
    const fill = document.getElementById('progressFill');
    if (fill) { fill.classList.remove('pulse'); void fill.offsetWidth; fill.classList.add('pulse'); }

    // 播放正确和弦的声音作为额外奖励
    SFX.strumChord(q.correct);
    setTimeout(() => {
      if (gameState.combo >= 3) {
        showCombo(gameState.combo);
        SFX.combo(gameState.combo);
        haptic('combo');
      } else {
        SFX.correct();
      }
    }, 400);
    showToast(`+${points}分！`, 'success');
    haptic('correct');
  } else {
    btn.classList.add('wrong');
    gameState.wrong++;
    gameState.combo = 0;
    SFX.wrong();
    haptic('wrong');
    showToast(`正确答案是 ${q.correct.name}`, 'error');
  }

  updateTopStats();

  // 题目滑出 + 下一题
  const feedbackDelay = isCorrect ? 600 : 1200;
  setTimeout(() => {
    const questionEl = document.getElementById('gameQuestion');
    const gridEl = document.getElementById('optionsGrid');
    questionEl.classList.add('question-slide-out');
    gridEl.classList.add('question-slide-out');
    // After slide-out animation (0.3s), advance to next question
    let advanced = false;
    const onSlideDone = () => {
      if (advanced) return;
      advanced = true;
      gameState.currentQ++;
      if (gameState.mode === 'speed') {
        if (gameState.timeLeft <= 0) {
          endGame();
        } else {
          showSpeedQuestion();
        }
      } else {
        if (gameState.currentQ >= gameState.totalQ) {
          endGame();
        } else {
          showQuestion();
        }
      }
    };
    // Use animationend if supported, fallback to timeout
    gridEl.addEventListener('animationend', onSlideDone, { once: true });
    // Safety fallback if animationend doesn't fire
    setTimeout(onSlideDone, 350);
  }, feedbackDelay);
}

// ===================== 速度计时器 =====================
function startSpeedTimer() {
  gameState.timeLeft = 60;
  if (gameState.timer) clearInterval(gameState.timer);
  gameState.timer = setInterval(() => {
    gameState.timeLeft--;
    const pct = (gameState.timeLeft / 60) * 100;
    const fill = document.getElementById('timerFill');
    fill.style.width = pct + '%';
    fill.className = 'fill' + (pct < 20 ? ' danger' : pct < 50 ? ' warning' : '');
    document.getElementById('speedTime').textContent = gameState.timeLeft;

    // 倒计时音效
    if (gameState.timeLeft <= 5 && gameState.timeLeft > 0) {
      SFX.tickUrgent();
    } else if (gameState.timeLeft <= 10 && gameState.timeLeft > 0) {
      SFX.tick();
    }

    if (gameState.timeLeft <= 0) {
      clearInterval(gameState.timer);
      gameState.timer = null;
      if (gameState.answered) {
        setTimeout(endGame, 300);
      } else {
        endGame();
      }
    }
  }, 1000);
}

// ===================== 结束游戏 =====================
function endGame() {
  if (gameState.timer) { clearInterval(gameState.timer); gameState.timer = null; }

  const total = gameState.correct + gameState.wrong;
  const accuracy = total > 0 ? Math.round((gameState.correct / total) * 100) : 0;
  const starCount = accuracy >= 90 ? 3 : accuracy >= 70 ? 2 : accuracy >= 40 ? 1 : 0;

  showPage('resultPage');

  // 根据成绩播放不同音效
  if (starCount >= 2) {
    SFX.gameComplete();
  } else {
    SFX.timeUp();
  }

  // 延迟播放星星音效
  if (starCount > 0) {
    setTimeout(() => SFX.starReveal(), 400);
  }

  // 星星 (延迟弹出)
  document.getElementById('resultStars').innerHTML = [1,2,3].map(i =>
    `<span class="star ${i<=starCount?'filled':''}" style="animation-delay:${0.3 + i*0.2}s">★</span>`
  ).join('');

  // 分数
  document.getElementById('resultScore').textContent = gameState.score;
  document.getElementById('resultLabel').textContent = gameState.mode === 'speed' ? '速度挑战得分' : gameState.mode === 'review' ? '错题回顾得分' : '总分';

  // 详细数据
  document.getElementById('resultDetails').innerHTML = `
    <div class="result-detail green"><div class="num">${gameState.correct}</div><div class="lbl">正确</div></div>
    <div class="result-detail red"><div class="num">${gameState.wrong}</div><div class="lbl">错误</div></div>
    <div class="result-detail yellow"><div class="num">${accuracy}%</div><div class="lbl">正确率</div></div>
    <div class="result-detail yellow"><div class="num">${gameState.maxCombo}</div><div class="lbl">最大连击</div></div>
  `;
}

function restartGame() {
  startGame();
}

</script>
<script>
// ===================== 初始化 =====================
window.addEventListener('DOMContentLoaded', () => {
  showPage('homePage');
  gameState.selectedCategories = [...DIFFICULTY_MAP.easy];
  initRipple();

  // 首次触摸/点击时初始化音频上下文（浏览器安全策略要求）
  const initAudio = () => {
    SFX.init();
    document.removeEventListener('touchstart', initAudio);
    document.removeEventListener('click', initAudio);
  };
  document.addEventListener('touchstart', initAudio, { once: true });
  document.addEventListener('click', initAudio, { once: true });
});
</script>
<script>
// ===================== 音阶图鉴 =====================
function playScaleById(id, posIdx) {
  const s = SCALES.find(x => x.id === id);
  if (s) SFX.playScale(s, posIdx);
}
let scaleFilter = '全部';
let scaleSearchText = '';
let scaleFiltered = [];
let scaleLoaded = 0;
let scaleObserver = null;
const SCALE_PAGE_SIZE = 12;

// 音阶测验状态
const scaleGameState = {
  mode: '', // 'quiz' or 'guide'
  categories: [],
  questions: [],
  currentQ: 0,
  totalQ: 10,
  score: 0,
  combo: 0,
  maxCombo: 0,
  correct: 0,
  wrong: 0,
  answered: false,
  selectedCategories: ['五声音阶', '大调音阶', '小调音阶'],
};

// 引导弹奏状态
let guideScale = null;
let guidePosition = 0;
let guideNoteIdx = 0;
let guideNotes = [];
let guideSkipped = 0;
let guideTotal = 0;

// ===================== 音阶子页面导航 =====================
function showScaleSubPage(subId) {
  document.querySelectorAll('#scalePage .scale-sub-page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('#scalePage .scale-nav-btn').forEach(b => b.classList.remove('active'));

  document.getElementById(subId).classList.add('active');
  const btnMap = { scaleLibrary: 0, scaleSetup: 1 };
  const btns = document.querySelectorAll('#scalePage .scale-nav-btn');
  if (btns[btnMap[subId]]) btns[btnMap[subId]].classList.add('active');

  if (subId === 'scaleLibrary') renderScaleLibrary();
}

// ===================== 音阶图鉴渲染 =====================
function renderScaleLibrary() {
  const filterBar = document.getElementById('scaleFilterBar');
  const searchActive = scaleSearchText.length > 0;
  filterBar.innerHTML = SCALE_CATEGORIES.map(c =>
    `<button class="filter-btn ${(!searchActive && c===scaleFilter)?'active':''}" onclick="filterScaleLibrary('${c}')">${c}</button>`
  ).join('');

  const activeBtn = filterBar.querySelector('.filter-btn.active');
  if (activeBtn) activeBtn.scrollIntoView({ behavior:'smooth', block:'nearest', inline:'center' });

  if (searchActive) {
    scaleFiltered = SCALES.filter(s => s.name.toLowerCase().includes(scaleSearchText.toLowerCase()));
  } else {
    scaleFiltered = scaleFilter === '全部' ? [...SCALES] : SCALES.filter(s => s.category === scaleFilter);
  }

  scaleLoaded = 0;
  loadMoreScales();
}

function loadMoreScales() {
  const grid = document.getElementById('scaleGrid');
  const sentinel = document.getElementById('scaleLoadSentinel');

  if (scaleLoaded === 0) grid.innerHTML = '';

  if (scaleFiltered.length === 0) {
    grid.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-dim);">没有找到匹配的音阶</div>';
    sentinel.style.display = 'none';
    return;
  }

  const remaining = scaleFiltered.length - scaleLoaded;
  const batch = Math.min(SCALE_PAGE_SIZE, remaining);
  const slice = scaleFiltered.slice(scaleLoaded, scaleLoaded + batch);

  grid.innerHTML += slice.map(s => {
    return `<div class="chord-card fade-in" onclick="SFX.click();playScaleById('${s.id}');showScaleDetail('${s.id}')">
      <div class="chord-name">${s.name}</div>
      ${renderScaleSVG(s, 0, 'position', 120)}
      <div class="chord-type">${s.category}</div>
    </div>`;
  }).join('');

  scaleLoaded += batch;

  if (scaleLoaded >= scaleFiltered.length) {
    sentinel.style.display = 'none';
    disconnectScaleObserver();
  } else {
    sentinel.style.display = '';
    setupScaleObserver();
  }
}

function setupScaleObserver() {
  if (scaleObserver) return;
  const sentinel = document.getElementById('scaleLoadSentinel');
  if (!sentinel) return;
  scaleObserver = new IntersectionObserver(entries => {
    if (entries[0].isIntersecting && scaleLoaded < scaleFiltered.length) loadMoreScales();
  }, { rootMargin: '200px' });
  scaleObserver.observe(sentinel);
}

function disconnectScaleObserver() {
  if (scaleObserver) { scaleObserver.disconnect(); scaleObserver = null; }
}

function filterScaleLibrary(cat) {
  scaleFilter = cat;
  scaleSearchText = '';
  document.getElementById('scaleSearch').value = '';
  disconnectScaleObserver();
  renderScaleLibrary();
}

function searchScaleLibrary(text) {
  scaleSearchText = text;
  disconnectScaleObserver();
  renderScaleLibrary();
}

// ===================== 音阶详情模态框 =====================
let scaleDetailPosition = 0;

function showScaleDetail(scaleId) {
  const scale = SCALES.find(s => s.id === scaleId);
  if (!scale) return;
  scaleDetailPosition = 0;

  const modal = document.getElementById('chordModal');
  const content = document.getElementById('modalContent');

  content.innerHTML = `
    <button class="close-btn" onclick="closeModal()">✕</button>
    <h2>${scale.name} <button class="btn btn-secondary" style="font-size:0.5em;padding:4px 10px;vertical-align:middle;" onclick="SFX.playScale(SCALES.find(s=>s.id==='${scaleId}'), ${scaleDetailPosition})">🔊 试听</button></h2>
    <div class="chord-svg-wrap" id="scaleDetailSVG">${renderScaleSVG(scale, scaleDetailPosition, 'full', 200)}</div>
    <div class="scale-position-tabs" id="scalePositionTabs">
      ${scale.positions.map((p, i) => `<button class="position-tab ${i===0?'active':''}" onclick="switchScalePosition('${scaleId}', ${i})">把位${i+1}</button>`).join('')}
    </div>
    <div style="margin-top:12px;font-size:0.9em;color:var(--text);">
      音符: <strong style="color:var(--accent)">${scale.notes.join(' ')}</strong>
    </div>
    <div style="margin-top:6px;font-size:0.9em;color:var(--text-dim);">
      类型: ${scale.category} | 根音: ${scale.root}
    </div>
    <div class="tip-box">💡 ${scale.tip}</div>
  `;
  modal.classList.add('show');
  SFX.playScale(scale, 0);
}

function switchScalePosition(scaleId, posIdx) {
  const scale = SCALES.find(s => s.id === scaleId);
  if (!scale) return;
  scaleDetailPosition = posIdx;

  document.getElementById('scaleDetailSVG').innerHTML = renderScaleSVG(scale, posIdx, 'full', 200);
  document.querySelectorAll('.position-tab').forEach((t, i) => t.classList.toggle('active', i === posIdx));
}

// ===================== 听音辨阶测验 =====================
function startScaleQuizSetup() {
  scaleGameState.mode = 'quiz';
  showScaleSubPage('scaleSetup');
  document.getElementById('scaleSetupTitle').textContent = '听音辨阶';

  const sel = document.getElementById('scaleCategorySelector');
  sel.innerHTML = SCALE_CATEGORIES.slice(1).map(c =>
    `<button class="diff-btn ${scaleGameState.selectedCategories.includes(c)?'active-medium':''}" onclick="toggleScaleCategory(this,'${c}')">
      <span class="diff-label">${c}</span>
    </button>`
  ).join('');
}

function toggleScaleCategory(btn, cat) {
  btn.classList.toggle('active-medium');
  if (btn.classList.contains('active-medium')) {
    if (!scaleGameState.selectedCategories.includes(cat)) scaleGameState.selectedCategories.push(cat);
  } else {
    scaleGameState.selectedCategories = scaleGameState.selectedCategories.filter(c => c !== cat);
  }
}

function startScaleGame() {
  const pool = SCALES.filter(s => scaleGameState.selectedCategories.includes(s.category));
  if (pool.length < 4) {
    showToast('音阶数量不足，请选择更多分类', 'error');
    return;
  }

  scaleGameState.score = 0;
  scaleGameState.combo = 0;
  scaleGameState.maxCombo = 0;
  scaleGameState.correct = 0;
  scaleGameState.wrong = 0;
  scaleGameState.currentQ = 0;
  scaleGameState.answered = false;

  if (scaleGameState.mode === 'quiz') {
    scaleGameState.totalQ = 10;
    generateScaleQuestions(pool);
    showPage('gamePage');
    updateGameLayoutMode();
    document.getElementById('gamePage').classList.add('mode-quiz');
    SFX.gameStart();
    showScaleQuizQuestion();
  } else if (scaleGameState.mode === 'guide') {
    startGuideGame();
  }
}

function generateScaleQuestions(pool) {
  scaleGameState.questions = [];
  const shuffled = [...pool].sort(() => Math.random() - 0.5);
  for (let i = 0; i < scaleGameState.totalQ; i++) {
    const correct = shuffled[i % shuffled.length];
    const options = [correct];
    const others = pool.filter(s => s.id !== correct.id).sort(() => Math.random() - 0.5);
    for (let j = 0; j < 3 && j < others.length; j++) options.push(others[j]);
    while (options.length < 4) {
      const extra = pool[Math.floor(Math.random() * pool.length)];
      if (!options.find(o => o.id === extra.id)) options.push(extra);
    }
    scaleGameState.questions.push({ correct, options: options.sort(() => Math.random() - 0.5) });
  }
}

function showScaleQuizQuestion() {
  const q = scaleGameState.questions[scaleGameState.currentQ];
  scaleGameState.answered = false;
  document.getElementById('replayBtn').style.display = '';

  document.getElementById('progressFill').style.width = `${(scaleGameState.currentQ / scaleGameState.totalQ) * 100}%`;
  document.getElementById('progressText').textContent = `${scaleGameState.currentQ + 1}/${scaleGameState.totalQ}`;
  document.getElementById('timerBar').style.display = 'none';
  document.getElementById('speedStats').style.display = 'none';

  const questionEl = document.getElementById('gameQuestion');
  const gridEl = document.getElementById('optionsGrid');

  document.getElementById('gameQuestionLabel').textContent = '听音阶，猜音阶名称';
  questionEl.innerHTML = `<button class="btn btn-primary" onclick="SFX.playScale(SCALES.find(s=>s.id==='${q.correct.id}'))" style="font-size:1.2em;padding:12px 24px;">🔊 播放音阶</button>`;
  questionEl.className = 'question-text question-slide-in';

  setTimeout(() => SFX.playScale(q.correct), 400);

  gridEl.innerHTML = q.options.map((opt, i) =>
    `<div class="option-btn" onclick="answerScaleQuiz(this, ${i})">
      <span class="opt-name">${opt.name}</span>
      <span style="font-size:0.8em;color:var(--text-dim)">${opt.category}</span>
    </div>`
  ).join('');
  gridEl.className = 'options-grid question-slide-in';
}

function answerScaleQuiz(btn, idx) {
  if (scaleGameState.answered) return;
  scaleGameState.answered = true;
  document.getElementById('replayBtn').style.display = 'none';

  const q = scaleGameState.questions[scaleGameState.currentQ];
  const selected = q.options[idx];
  const isCorrect = selected.id === q.correct.id;

  const allBtns = document.querySelectorAll('.option-btn');
  allBtns.forEach((b, i) => {
    if (q.options[i].id === q.correct.id) b.classList.add('correct');
  });

  if (isCorrect) {
    scaleGameState.correct++;
    scaleGameState.combo++;
    if (scaleGameState.combo > scaleGameState.maxCombo) scaleGameState.maxCombo = scaleGameState.combo;
    const comboBonus = Math.min(scaleGameState.combo, 5);
    const points = 10 + comboBonus * 2;
    scaleGameState.score += points;
    gameState.totalScore += points;
    gameState.combo = scaleGameState.combo;

    const rect = btn.getBoundingClientRect();
    showFloatingScore(rect.left + rect.width/2, rect.top, `+${points}`);
    SFX.correct();
    showToast(`+${points}分！`, 'success');
  } else {
    btn.classList.add('wrong');
    scaleGameState.wrong++;
    scaleGameState.combo = 0;
    gameState.combo = 0;
    SFX.wrong();
    showToast(`正确答案是 ${q.correct.name}`, 'error');
  }

  updateTopStats();

  setTimeout(() => {
    scaleGameState.currentQ++;
    if (scaleGameState.currentQ >= scaleGameState.totalQ) {
      endScaleGame();
    } else {
      showScaleQuizQuestion();
    }
  }, isCorrect ? 600 : 1200);
}

function endScaleGame() {
  const total = scaleGameState.correct + scaleGameState.wrong;
  const accuracy = total > 0 ? Math.round((scaleGameState.correct / total) * 100) : 0;
  const starCount = accuracy >= 90 ? 3 : accuracy >= 70 ? 2 : accuracy >= 40 ? 1 : 0;

  showPage('resultPage');
  if (starCount >= 2) SFX.gameComplete(); else SFX.timeUp();
  if (starCount > 0) setTimeout(() => SFX.starReveal(), 400);

  document.getElementById('resultStars').innerHTML = [1,2,3].map(i =>
    `<span class="star ${i<=starCount?'filled':''}" style="animation-delay:${0.3+i*0.2}s">★</span>`
  ).join('');

  document.getElementById('resultScore').textContent = scaleGameState.score;
  document.getElementById('resultLabel').textContent = '听音辨阶得分';
  document.getElementById('resultDetails').innerHTML = `
    <div class="result-detail green"><div class="num">${scaleGameState.correct}</div><div class="lbl">正确</div></div>
    <div class="result-detail red"><div class="num">${scaleGameState.wrong}</div><div class="lbl">错误</div></div>
    <div class="result-detail yellow"><div class="num">${accuracy}%</div><div class="lbl">正确率</div></div>
    <div class="result-detail yellow"><div class="num">${scaleGameState.maxCombo}</div><div class="lbl">最大连击</div></div>
  `;
}

// ===================== 引导弹奏 =====================
function startScaleGuideSetup() {
  scaleGameState.mode = 'guide';
  showScaleSubPage('scaleSetup');
  document.getElementById('scaleSetupTitle').textContent = '引导弹奏';

  const sel = document.getElementById('scaleCategorySelector');
  sel.innerHTML = SCALES.filter(s => s.category === '五声音阶' || s.category === '大调音阶').slice(0, 8).map(s =>
    `<button class="diff-btn ${guideScale && guideScale.id===s.id ? 'active-medium':''}" onclick="selectGuideScale('${s.id}')">
      <span class="diff-label">${s.name}</span>
      <span class="diff-desc">${s.category}</span>
    </button>`
  ).join('');
}

function selectGuideScale(scaleId) {
  guideScale = SCALES.find(s => s.id === scaleId);
  document.querySelectorAll('#scaleCategorySelector .diff-btn').forEach(b => b.classList.remove('active-medium'));
  event.target.closest('.diff-btn').classList.add('active-medium');
}

// 引导弹奏使用 gamePage 的特殊布局
// 将在下一个 task 中实现完整引导弹奏逻辑

// ===================== 引导弹奏完整实现 =====================
function startGuideGame() {
  if (!guideScale) {
    showToast('请先选择一个音阶', 'error');
    return;
  }
  guidePosition = 0;
  guideSkipped = 0;
  guideNoteIdx = 0;

  // 收集当前把位的所有音符（从低弦到高弦，按品位排序）
  collectGuideNotes();

  showPage('gamePage');
  const page = document.getElementById('gamePage');
  page.classList.remove('mode-quiz', 'mode-reverse', 'mode-speed');
  page.classList.add('mode-quiz'); // 复用 quiz 布局（大图区+小按钮区）
  document.getElementById('timerBar').style.display = 'none';
  document.getElementById('speedStats').style.display = 'none';

  showGuideNote();
}

function collectGuideNotes() {
  const pos = guideScale.positions[guidePosition];
  guideNotes = [];
  for (let si = 0; si < 6; si++) {
    const strNotes = pos.strings[si];
    strNotes.forEach((n, ni) => {
      if (n.f >= 0) {
        guideNotes.push({ stringIdx: si, noteIdx: ni, fret: n.f, note: n.n, isRoot: n.isRoot });
      }
    });
  }
  // 按品位排序（上行）
  guideNotes.sort((a, b) => a.fret - b.fret || a.stringIdx - b.stringIdx);
  guideTotal = guideNotes.length;
}

function showGuideNote() {
  if (guideNoteIdx >= guideNotes.length) {
    endGuideGame();
    return;
  }

  const note = guideNotes[guideNoteIdx];
  const progress = guideNoteIdx / guideNotes.length;

  document.getElementById('progressFill').style.width = `${progress * 100}%`;
  document.getElementById('progressText').textContent = `${guideNoteIdx + 1}/${guideNotes.length}`;

  const questionEl = document.getElementById('gameQuestion');
  const gridEl = document.getElementById('optionsGrid');

  document.getElementById('gameQuestionLabel').textContent = `${guideScale.name} - 把位${guidePosition + 1}`;

  // 渲染指板图，当前音符高亮
  questionEl.innerHTML = `<div class="chord-svg-container">${renderGuideScaleSVG(guideScale, guidePosition, guideNoteIdx)}</div>`;
  questionEl.className = 'question-text chord-display';

  // 播放当前音符
  setTimeout(() => SFX.playScaleNote(guideScale, guidePosition, note.stringIdx, note.noteIdx), 200);

  // 选项区：确认 + 跳过
  gridEl.innerHTML = `
    <div class="option-btn" onclick="guideAnswer(true)" style="grid-column:1/3;background:rgba(78,205,196,0.15);border-color:rgba(78,205,196,0.3);">
      <span class="opt-name" style="color:#4ecdc4;">✓ 弹这个音</span>
      <span style="font-size:0.8em;color:var(--text-dim)">${note.note} (${6-note.stringIdx}弦${note.fret}品)</span>
    </div>
    <div class="option-btn" onclick="guideAnswer(false)" style="grid-column:1/3;background:rgba(233,69,96,0.1);border-color:rgba(233,69,96,0.2);">
      <span class="opt-name" style="color:#e94560;">→ 跳过</span>
    </div>
  `;
  gridEl.className = 'options-grid';
}

function renderGuideScaleSVG(scale, positionIdx, activeNoteIdx) {
  // 把位视图，当前音符闪烁高亮
  const pos = scale.positions[positionIdx];
  const size = 160;
  const fretCount = 6;
  const w = size, h = size * 0.65;
  const pad = 28;
  const strSpacing = (w - 2 * pad) / 5;
  const fretSpacing = (h - 28) / fretCount;
  const dotR = strSpacing * 0.28;

  let svg = `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" style="display:block;">`;

  svg += `<rect x="${pad-3}" y="10" width="${strSpacing*5+6}" height="${fretSpacing*fretCount+4}" rx="3" fill="#3a2a1a"/>`;

  if (pos.startFret > 0) {
    svg += `<text x="12" y="${10 + fretSpacing/2 + 4}" fill="#f39c12" font-size="11" font-weight="700">${pos.startFret}fr</text>`;
  }

  for (let i = 0; i <= fretCount; i++) {
    const y = 10 + i * fretSpacing;
    const fw = i === 0 ? 3 : 2.5;
    svg += `<rect x="${pad-1}" y="${y-fw/2}" width="${strSpacing*5+2}" height="${fw}" rx="1" fill="#c8c0b0"/>`;
  }

  if (pos.startFret === 0) {
    svg += `<rect x="${pad-3}" y="8" width="${strSpacing*5+6}" height="5" rx="2" fill="#ddd"/>`;
  }

  const strNames = ['E','A','D','G','B','e'];
  for (let i = 0; i < 6; i++) {
    const x = pad + i * strSpacing;
    svg += `<text x="${x}" y="6" text-anchor="middle" fill="#95a5a6" font-size="9">${strNames[i]}</text>`;
  }

  for (let i = 0; i < 6; i++) {
    const x = pad + i * strSpacing;
    const sw = 1.8 - i * 0.18;
    svg += `<line x1="${x}" y1="10" x2="${x}" y2="${10+fretSpacing*fretCount}" stroke="#c0b090" stroke-width="${sw}"/>`;
  }

  // 音符
  const stringData = pos.strings;
  let noteCounter = 0;
  for (let si = 0; si < 6; si++) {
    const x = pad + si * strSpacing;
    const notes = stringData[5 - si];
    for (const note of notes) {
      const relFret = pos.startFret === 0 ? note.f : note.f - pos.startFret;
      if (relFret < 0 || relFret > fretCount) continue;
      const y = 10 + (relFret === 0 ? -4 : (relFret - 0.5) * fretSpacing);

      const isActive = noteCounter === activeNoteIdx;
      const isPast = noteCounter < activeNoteIdx;

      if (isActive) {
        // 当前音符：金色闪烁
        svg += `<circle cx="${x}" cy="${y}" r="${dotR+3}" fill="#f39c12" class="scale-note-active"/>`;
        svg += `<text x="${x}" y="${y+3}" text-anchor="middle" fill="#000" font-size="${dotR*1.1}" font-weight="700">${note.d || 'R'}</text>`;
      } else if (isPast) {
        // 已弹过：绿色
        svg += `<circle cx="${x}" cy="${y}" r="${dotR}" fill="#4ecdc4"/>`;
      } else if (note.isRoot) {
        svg += `<circle cx="${x}" cy="${y}" r="${dotR+1}" fill="#e74c3c" opacity="0.4"/>`;
      } else {
        svg += `<circle cx="${x}" cy="${y}" r="${dotR}" fill="#3498db" opacity="0.3"/>`;
      }
      noteCounter++;
    }
  }

  svg += '</svg>';
  return svg;
}

function guideAnswer(played) {
  if (played) {
    scaleGameState.correct++;
    scaleGameState.combo++;
    SFX.correct();
  } else {
    guideSkipped++;
    scaleGameState.combo = 0;
    SFX.wrong();
  }

  guideNoteIdx++;
  showGuideNote();
}

function endGuideGame() {
  const played = guideTotal - guideSkipped;
  const accuracy = guideTotal > 0 ? Math.round((played / guideTotal) * 100) : 0;
  const starCount = accuracy >= 90 ? 3 : accuracy >= 70 ? 2 : accuracy >= 40 ? 1 : 0;

  showPage('resultPage');
  if (starCount >= 2) SFX.gameComplete(); else SFX.timeUp();
  if (starCount > 0) setTimeout(() => SFX.starReveal(), 400);

  document.getElementById('resultStars').innerHTML = [1,2,3].map(i =>
    `<span class="star ${i<=starCount?'filled':''}" style="animation-delay:${0.3+i*0.2}s">★</span>`
  ).join('');

  document.getElementById('resultScore').textContent = played * 10;
  document.getElementById('resultLabel').textContent = `${guideScale.name} 弹奏完成`;
  document.getElementById('resultDetails').innerHTML = `
    <div class="result-detail green"><div class="num">${played}</div><div class="lbl">弹奏</div></div>
    <div class="result-detail red"><div class="num">${guideSkipped}</div><div class="lbl">跳过</div></div>
    <div class="result-detail yellow"><div class="num">${accuracy}%</div><div class="lbl">完成度</div></div>
    <div class="result-detail yellow"><div class="num">${guideTotal}</div><div class="lbl">总音符</div></div>
  `;
}

function renderAnnotatedChordSVG() {
  // Render a sample Am chord with annotation lines
  const size = 160;
  const w = size + 80, h = size * 1.3; // extra width for annotations
  const startX = 25, startY = 28;
  const strSpacing = (size - 50) / 5;
  const fretSpacing = (h - 55) / 5;
  const dotR = strSpacing * 0.32;

  // Am chord data: frets=[-1,0,2,2,1,0], fingers=[0,0,2,3,1,0]
  const frets = [-1, 0, 2, 2, 1, 0];
  const fingerColors = ['', '#e74c3c', '#3498db', '#2ecc71', '#f39c12'];
  const fingerNums = [0, 0, 2, 3, 1, 0];
  const stringNames = ['E','A','D','G','B','e'];

  let svg = `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" style="display:block;">`;

  // Wood background
  svg += `<defs>
    <linearGradient id="helpWood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3a2a1a"/><stop offset="30%" stop-color="#4a3a2a"/>
      <stop offset="60%" stop-color="#3d2d1d"/><stop offset="100%" stop-color="#4a3a2a"/>
    </linearGradient>
  </defs>`;
  svg += `<rect x="${startX-4}" y="${startY-2}" width="${strSpacing*5+8}" height="${fretSpacing*5+6}" rx="3" fill="url(#helpWood)"/>`;

  // Nut
  svg += `<rect x="${startX-3}" y="${startY-5}" width="${strSpacing*5+6}" height="6" rx="2" fill="#ddd"/>`;

  // Fret lines
  for (let i = 0; i <= 5; i++) {
    const y = startY + i * fretSpacing;
    svg += `<line x1="${startX-1}" y1="${y}" x2="${startX+strSpacing*5+1}" y2="${y}" stroke="#c0c0c0" stroke-width="${i===0?3:2}"/>`;
  }

  // Strings
  for (let i = 0; i < 6; i++) {
    const x = startX + i * strSpacing;
    const sw = 1.8 - i * 0.18;
    svg += `<line x1="${x}" y1="${startY}" x2="${x}" y2="${startY+fretSpacing*5}" stroke="${i<3?'#d4d4d4':'#bbb'}" stroke-width="${sw}"/>`;
  }

  // String names
  for (let i = 0; i < 6; i++) {
    const x = startX + i * strSpacing;
    svg += `<text x="${x}" y="${startY-10}" text-anchor="middle" fill="#95a5a6" font-size="10">${stringNames[i]}</text>`;
  }

  // Note dots and annotations
  const annotations = [];
  for (let i = 0; i < 6; i++) {
    const x = startX + i * strSpacing;
    const fret = frets[i];
    const finger = fingerNums[i];

    if (fret === -1) {
      svg += `<text x="${x}" y="${startY+fretSpacing*5+16}" text-anchor="middle" fill="#e74c3c" font-size="12" font-weight="700">✕</text>`;
      annotations.push({ x, y: startY+fretSpacing*5+16, text: '闷音', side: 'right' });
    } else if (fret === 0) {
      svg += `<circle cx="${x}" cy="${startY+fretSpacing*5+10}" r="${dotR*0.7}" fill="none" stroke="#27ae60" stroke-width="1.5"/>`;
      annotations.push({ x, y: startY+fretSpacing*5+10, text: '开放弦', side: 'right' });
    } else {
      const y = startY + (fret - 0.5) * fretSpacing;
      const color = finger > 0 ? fingerColors[finger] : '#ecf0f1';
      svg += `<circle cx="${x}" cy="${y}" r="${dotR}" fill="${color}"/>`;
      svg += `<text x="${x}" y="${y+4}" text-anchor="middle" fill="#fff" font-size="${dotR*1.3}" font-weight="700">${finger}</text>`;
      annotations.push({ x, y, text: `${finger}=${finger===1?'食指':finger===2?'中指':finger===3?'无名指':'小指'}`, side: 'right' });
    }
  }

  // Annotation lines and labels
  const labelX = startX + strSpacing * 5 + 20;
  const labelSpacing = 18;
  const startYLabel = startY;

  // Nut annotation
  const nutY = startY - 3;
  svg += `<line x1="${startX+strSpacing*5+2}" y1="${nutY}" x2="${labelX}" y2="${startYLabel}" stroke="#f39c12" stroke-width="1" stroke-dasharray="3,2"/>`;
  svg += `<text x="${labelX}" y="${startYLabel+4}" fill="#f39c12" font-size="9" font-weight="600">琴枕</text>`;

  // String names annotation
  svg += `<line x1="${startX}" y1="${startY-10}" x2="${labelX}" y2="${startYLabel+20}" stroke="#95a5a6" stroke-width="1" stroke-dasharray="3,2"/>`;
  svg += `<text x="${labelX}" y="${startYLabel+24}" fill="#95a5a6" font-size="9">弦名</text>`;

  // Dot annotations (only show a few key ones to avoid clutter)
  const keyAnnotations = annotations.filter((a, idx) => idx === 0 || idx === 1 || idx === 3 || idx === 5);
  keyAnnotations.forEach((a, i) => {
    const labelY = startYLabel + 40 + i * 20;
    svg += `<line x1="${a.x + dotR + 3}" y1="${a.y}" x2="${labelX}" y2="${labelY}" stroke="rgba(255,255,255,0.3)" stroke-width="1" stroke-dasharray="3,2"/>`;
    svg += `<text x="${labelX}" y="${labelY+4}" fill="var(--text-dim)" font-size="9">${a.text}</text>`;
  });

  svg += '</svg>';
  return svg;
}

function renderAnnotatedScaleSVG() {
  // Render a sample C major pentatonic position 0 with annotations
  const size = 180;
  const w = size + 80, h = size * 0.65;
  const pad = 28;
  const strSpacing = (size - 2 * pad) / 5;
  const fretSpacing = (h - 28) / 6;
  const dotR = strSpacing * 0.28;

  let svg = `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" style="display:block;">`;

  // Background
  svg += `<rect x="${pad-3}" y="10" width="${strSpacing*5+6}" height="${fretSpacing*6+4}" rx="3" fill="#3a2a1a"/>`;

  // Fret lines
  for (let i = 0; i <= 6; i++) {
    const y = 10 + i * fretSpacing;
    svg += `<line x1="${pad-1}" y1="${y}" x2="${pad+strSpacing*5+1}" y2="${y}" stroke="#c8c0b0" stroke-width="${i===0?3:2}"/>`;
  }

  // Nut
  svg += `<rect x="${pad-3}" y="8" width="${strSpacing*5+6}" height="5" rx="2" fill="#ddd"/>`;

  // String names
  const strNames = ['E','A','D','G','B','e'];
  for (let i = 0; i < 6; i++) {
    const x = pad + i * strSpacing;
    svg += `<text x="${x}" y="6" text-anchor="middle" fill="#95a5a6" font-size="9">${strNames[i]}</text>`;
  }

  // Strings
  for (let i = 0; i < 6; i++) {
    const x = pad + i * strSpacing;
    const sw = 1.8 - i * 0.18;
    svg += `<line x1="${x}" y1="10" x2="${x}" y2="${10+fretSpacing*6}" stroke="#c0b090" stroke-width="${sw}"/>`;
  }

  // Sample scale notes (C major pentatonic, position 0 simplified)
  const notes = [
    // E string: open(E=root alternate), 3(G)
    { str: 0, fret: 0, isRoot: false, label: '0' },
    { str: 0, fret: 3, isRoot: false, label: '3' },
    // A string: 2(C=root), 5(E)
    { str: 1, fret: 2, isRoot: true, label: 'R' },
    { str: 1, fret: 5, isRoot: false, label: '2' },
    // D string: 2(D), 4(E)
    { str: 2, fret: 2, isRoot: false, label: '1' },
    // G string: open(G), 2(A)
    { str: 3, fret: 0, isRoot: false, label: '0' },
    { str: 3, fret: 2, isRoot: false, label: '3' },
    // B string: open(B), 1(C=root)
    { str: 4, fret: 1, isRoot: true, label: 'R' },
    // e string: open(e), 3(G)
    { str: 5, fret: 0, isRoot: false, label: '0' },
    { str: 5, fret: 3, isRoot: false, label: '4' },
  ];

  // Draw notes
  const annotations = [];
  for (const note of notes) {
    const x = pad + note.str * strSpacing;
    const y = note.fret === 0 ? 10 - 4 : 10 + (note.fret - 0.5) * fretSpacing;

    if (note.isRoot) {
      svg += `<circle cx="${x}" cy="${y}" r="${dotR+1.5}" fill="#e74c3c"/>`;
      svg += `<text x="${x}" y="${y+3}" text-anchor="middle" fill="#fff" font-size="${dotR*1.1}" font-weight="700">${note.label}</text>`;
      annotations.push({ x, y, text: 'R = 根音', isRoot: true });
    } else {
      svg += `<circle cx="${x}" cy="${y}" r="${dotR}" fill="#3498db"/>`;
      svg += `<text x="${x}" y="${y+2.5}" text-anchor="middle" fill="#fff" font-size="${dotR*0.9}">${note.label}</text>`;
      annotations.push({ x, y, text: '手指编号', isRoot: false });
    }
  }

  // Annotation lines
  const labelX = pad + strSpacing * 5 + 16;

  // Root annotation
  const rootNote = annotations.find(a => a.isRoot);
  if (rootNote) {
    svg += `<line x1="${rootNote.x + dotR + 3}" y1="${rootNote.y}" x2="${labelX}" y2="20" stroke="#e74c3c" stroke-width="1" stroke-dasharray="3,2"/>`;
    svg += `<text x="${labelX}" y="24" fill="#e74c3c" font-size="9" font-weight="600">R = 根音</text>`;
  }

  // Blue dot annotation
  const blueNote = annotations.find(a => !a.isRoot);
  if (blueNote) {
    svg += `<line x1="${blueNote.x + dotR + 3}" y1="${blueNote.y}" x2="${labelX}" y2="40" stroke="#3498db" stroke-width="1" stroke-dasharray="3,2"/>`;
    svg += `<text x="${labelX}" y="44" fill="#3498db" font-size="9">蓝色=其他音级</text>`;
  }

  // Nut annotation
  svg += `<line x1="${pad+strSpacing*5+2}" y1="10" x2="${labelX}" y2="56" stroke="#95a5a6" stroke-width="1" stroke-dasharray="3,2"/>`;
  svg += `<text x="${labelX}" y="60" fill="#95a5a6" font-size="9">琴枕/品位线</text>`;

  // String name annotation
  svg += `<line x1="${pad}" y1="6" x2="${labelX}" y2="72" stroke="#95a5a6" stroke-width="1" stroke-dasharray="3,2"/>`;
  svg += `<text x="${labelX}" y="76" fill="#95a5a6" font-size="9">弦名</text>`;

  svg += '</svg>';
  return svg;
}

function renderGameModesHelp() {
  const modes = [
    { icon: '📚', name: '和弦图鉴', desc: '浏览所有和弦的指法图，点击可试听和查看详情' },
    { icon: '🧠', name: '和弦测验', desc: '看和弦图猜名称，4个选项中选择正确答案' },
    { icon: '🔄', name: '指法挑战', desc: '看和弦名称，从4个指法图中选择正确的' },
    { icon: '⚡', name: '速度挑战', desc: '60秒限时答题，看图猜名或看名选图，随机切换' },
    { icon: '📝', name: '错题回顾', desc: '专练你答错的和弦，巩固薄弱环节' },
    { icon: '🎵', name: '音阶学习', desc: '音阶图鉴浏览、听音辨阶测验、引导弹奏练习' },
  ];

  let items = modes.map(m => `
    <li class="mode-list-item">
      <span class="mode-list-icon">${m.icon}</span>
      <div>
        <div class="mode-list-name">${m.name}</div>
        <div class="mode-list-desc">${m.desc}</div>
      </div>
    </li>
  `).join('');

  return `
    <div class="help-section">
      <div class="help-section-title"><span class="icon">🎮</span> 游戏模式说明</div>
      <ul class="mode-list">${items}</ul>
    </div>
  `;
}
</script>
</body>
</html>
